/* ------------------------------------------------------------------
   CARGA DE PDF (panel de inicio)
   El juego no puede leer/interpretar el PDF por sí solo (no hay IA en
   el navegador): esta función solo guarda el archivo como "en espera"
   (nombre, tamaño y una estimación de páginas) para que confirmes que
   se seleccionó el correcto antes de pegarlo en el chat con Claude,
   quien sí genera las preguntas y las agrega como un artículo nuevo.
------------------------------------------------------------------- */
async function estimatePageCount(file){
  try{
    const buf = await file.arrayBuffer();
    const text = new TextDecoder('iso-8859-1').decode(buf);
    const matches = text.match(/\/Type\s*\/Page[^s]/g);
    return matches ? matches.length : 0;
  }catch(e){ return -1; } // -1 = no se pudo leer el archivo
}
async function handlePdfFile(file){
  if(!file) return;
  DATA.pdfStaging = { name:file.name, sizeKB:Math.round(file.size/1024), pages:null, status:'reading', loadedAt:Date.now() };
  saveData(); render();
  const pages = await estimatePageCount(file);
  if(DATA.pdfStaging && DATA.pdfStaging.name === file.name){
    DATA.pdfStaging.pages = pages;
    DATA.pdfStaging.status = 'ready';
    saveData(); render();
  }
}

/* ------------------------------------------------------------------
   MAZO DE REPASO (tarjetas estilo Anki, repetición espaciada SM-2)
   Cada pregunta que contestas en batalla -- de cualquier artículo,
   pasado o presente -- se convierte en tarjeta y queda aquí para
   siempre, aunque cambies de artículo o reinicies la campaña.
------------------------------------------------------------------- */
function ensureDeckCard(id){
  if(!DATA.deck[id]) DATA.deck[id] = { ef:2.5, interval:0, reps:0, due:Date.now(), lapses:0, createdAt:Date.now() };
  return DATA.deck[id];
}
function scheduleDeckCard(id, quality){
  const c = ensureDeckCard(id);
  if(quality < 3){
    c.reps = 0; c.interval = 1; c.lapses++;
  } else {
    if(c.reps === 0) c.interval = 1;
    else if(c.reps === 1) c.interval = 6;
    else c.interval = Math.round(c.interval * c.ef);
    c.reps++;
  }
  c.ef = Math.max(1.3, c.ef + (0.1 - (5-quality)*(0.08+(5-quality)*0.02)));
  c.due = Date.now() + c.interval*86400000;
  saveData();
}
function deckDueIds(){
  const now = Date.now();
  return Object.keys(DATA.deck).filter(id => DATA.deck[id].due <= now && byId[id]);
}
function deckStats(){
  const ids = Object.keys(DATA.deck).filter(id => byId[id]);
  const now = Date.now();
  return {
    total: ids.length,
    due: ids.filter(id => DATA.deck[id].due <= now).length,
    mature: ids.filter(id => DATA.deck[id].interval >= 21).length,
  };
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* Preguntas de OTROS artículos que el jugador ya estudió alguna vez
   (es decir, que ya existen como tarjeta en el cuaderno de repaso). */
function studiedOtherQuestions(){
  return QUESTIONS.filter(q => q.article !== CURRENT_ARTICLE && DATA.deck[q.id]);
}

/* Saca de `pool` una pregunta de dificultad `want`; si no hay,
   busca la dificultad más cercana disponible. Devuelve null si el pool
   quedó vacío. Muta `taken` para no repetir dentro del mismo nivel. */
function drawByDiff(pool, want, taken){
  const order = [want, want-1, want+1, want-2, want+2].filter(d => d>=1 && d<=3);
  for(const d of order){
    const avail = pool.filter(q => q.diff === d && !taken.has(q.id));
    if(avail.length) {
      const q = avail[Math.floor(Math.random()*avail.length)];
      taken.add(q.id);
      return q;
    }
  }
  return null;
}

/* Arma el mazo completo de un nivel:
     · nunca repite una pregunta dentro del nivel
     · evita las ya usadas en la campaña mientras queden preguntas frescas
     · respeta la curva de dificultad del nivel
     · mezcla 80% artículo actual / 20% artículos ya estudiados */
function pickQuestionsForLevel(levelNum, excludeIds, count){
  const n = count || maxQuestionsForLevel(MAX_ARCHETYPE_HP);
  const excluded = new Set(excludeIds || []);
  const taken = new Set();

  const allCurrent = activeQuestions();
  const allOthers  = studiedOtherQuestions();
  // Preferimos preguntas nunca vistas en esta campaña; si se agotan, se reabre el pool.
  const freshCurrent = allCurrent.filter(q => !excluded.has(q.id));
  const freshOthers  = allOthers.filter(q => !excluded.has(q.id));

  const plan = diffPlan(levelNum, n);
  // ¿Cuántos huecos van a artículos de repaso? Solo si hay material disponible.
  const wantOthers = allOthers.length ? Math.min(Math.round(n * (1-CURRENT_SHARE)), allOthers.length) : 0;
  const otherSlots = new Set(shuffle(plan.map((_,i)=>i)).slice(0, wantOthers));

  const chosen = [];
  plan.forEach((want, i) => {
    const preferOther = otherSlots.has(i);
    // Orden de pools a intentar: el preferido, el otro, y por último reabrir repetidas.
    const chain = preferOther
      ? [freshOthers, freshCurrent, allOthers, allCurrent]
      : [freshCurrent, freshOthers, allCurrent, allOthers];
    for(const pool of chain){
      const q = drawByDiff(pool, want, taken);
      if(q){ chosen.push(q); return; }
    }
  });
  return shuffle(chosen);
}

/* Diagnóstico de cobertura: cuántas preguntas tiene un artículo frente a
   las que necesitaría para cubrir los 10 niveles sin repetir. */
function articleCoverage(articleId){
  const art = articleById(articleId);
  const qs_ = QUESTIONS.filter(q => q.article === articleId);
  const budget = questionBudget(MAX_ARCHETYPE_HP);
  const byDiff = { 1:0, 2:0, 3:0 };
  const byKind = { directa:0, caso:0 };
  qs_.forEach(q => { byDiff[q.diff]++; byKind[q.kind]++; });
  // Con la mezcla 80/20, cada nivel consume ~80% de su mazo del artículo activo.
  const perLevelFromArticle = Math.max(1, Math.round(budget.perLevelMax * CURRENT_SHARE));
  return {
    name: art ? art.name : articleId,
    have: qs_.length,
    need: budget.needCurrent,
    comfortable: budget.comfortable,
    levelsCovered: Math.min(NUM_LEVELS, Math.floor(qs_.length / perLevelFromArticle)),
    byDiff, byKind, budget,
  };
}

function clearedCount(){ return DATA.campaign.levelsCleared.filter(Boolean).length; }
function nextUnlockedLevel(){ return Math.min(10, clearedCount()+1); }

function startLevel(levelNum){
  const archetype = getArchetype(DATA.avatar.classId);
  const maxHp = archetype.hp;
  const playerHp = DATA.campaign.playerHp != null ? Math.min(DATA.campaign.playerHp, maxHp) : maxHp;
  const levelDef = LEVELS[levelNum-1];
  // El mazo se arma completo para el peor caso del nivel: así nunca hay
  // que rellenarlo a mitad del combate y jamás se repite una pregunta.
  const deck = pickQuestionsForLevel(levelNum, DATA.campaign.usedQuestionIds, maxQuestionsForLevel(maxHp));
  S.run = {
    levelNum, archetype, def: levelDef, deck, pos:0,
    player: { hp: playerHp, maxHp },
    enemy: { hp: ENEMY_MAX_HP, maxHp: ENEMY_MAX_HP },
    freeMissLeft: archetype.freeMiss || 0,
    firstMissUsed: false, // se resetea cada nivel, para el Temple del Forjador
    streak:0, maxStreak:0, correctCount:0, missCount:0,
    answeredCurrent:false, selectedIndex:null, lastCorrect:null, lastDmg:0, lastCrit:false,
    cardShownAt:0, timerId:null, remainingMs:0, totalMs:0,
    phase:'intro',
    awaitingConfidence:false, pendingIndex:null,
    debriefLog:[], // intentos de este combate: {conceptIds, correct, confidence, knowledgeType, difficulty}
  };
  S.screen = 'battle';
  render();
}

function travelToLevel(levelNum){
  const marker = qs('mapPlayerMarker');
  const target = NODE_POS[levelNum-1];
  if(!marker || !target){ startLevel(levelNum); return; }
  const archetype = getArchetype(DATA.avatar.classId);
  marker.style.left = target.x+'%';
  marker.style.top = target.y+'%';
  let flip = false;
  const walkInt = setInterval(() => {
    flip = !flip;
    marker.innerHTML = playerSpriteHtml(archetype, 4, flip?1:0);
  }, 140);
  setTimeout(() => { clearInterval(walkInt); startLevel(levelNum); }, 640);
}

function currentQuestion(){ return S.run ? S.run.deck[S.run.pos] : null; }

/* Las opciones se barajan por partida para que la posición de la
   respuesta correcta no sea predecible (evita que "casi siempre es A")
   El orden se calcula una sola vez por posición del mazo y se guarda
   en caché para que no cambie entre el render y la validación. */
function shuffledView(q, cacheKey){
  const run = S.run;
  if(!run) return { options:q.options, correct:q.correct };
  if(!run.shuffleCache) run.shuffleCache = {};
  if(!run.shuffleCache[cacheKey]){
    const order = shuffle([0,1,2,3]);
    run.shuffleCache[cacheKey] = {
      options: order.map(i => q.options[i]),
      correct: order.indexOf(q.correct),
    };
  }
  return run.shuffleCache[cacheKey];
}

function beginBattle(){
  const run = S.run;
  run.phase = 'fighting';
  render();
  beginTimer();
}

function beginTimer(){
  const run = S.run;
  clearInterval(run.timerId);
  const q = currentQuestion();
  run.totalMs = TIME_BY_DIFF[q.diff] + (run.archetype.timeBonusMs||0);
  run.remainingMs = run.totalMs;
  run.cardShownAt = Date.now();
  updateTimerDom();
  run.timerId = setInterval(() => {
    if(!S.run || S.run.answeredCurrent) return;
    run.remainingMs -= 100;
    if(run.remainingMs <= 0){
      run.remainingMs = 0;
      updateTimerDom();
      clearInterval(run.timerId);
      handleAnswer(null);
      return;
    }
    updateTimerDom();
  }, 100);
}

function updateTimerDom(){
  const run = S.run;
  const bar = qs('timerBar'), label = qs('timerLabel');
  if(!bar || !run) return;
  const frac = Math.max(0, run.remainingMs / run.totalMs);
  bar.style.width = (frac*100).toFixed(1)+'%';
  bar.style.background = frac < 0.25 ? 'var(--danger)' : frac < 0.5 ? 'var(--gold)' : 'var(--success)';
  if(label) label.textContent = Math.ceil(run.remainingMs/1000)+'s';
}

function updateHpDom(side){
  const run = S.run;
  const c = side === 'enemy' ? run.enemy : run.player;
  const fill = qs(side+'HpFill'), label = qs(side+'HpLabel');
  if(!fill) return;
  const frac = Math.max(0, c.hp / c.maxHp);
  fill.style.width = (frac*100).toFixed(1)+'%';
  fill.classList.toggle('low', frac < 0.3);
  if(label) label.textContent = Math.max(0,c.hp)+' / '+c.maxHp;
}

function triggerFx(elId, cls, duration){
  const el = qs(elId);
  if(!el) return;
  const target = el.querySelector('.pixel-sprite') || el;
  target.classList.remove(cls); void target.offsetWidth; target.classList.add(cls);
  setTimeout(() => target.classList.remove(cls), duration);
}
function triggerShake(elId){ triggerFx(elId, 'shake', 400); }
function triggerLunge(elId){ triggerFx(elId, 'lunge', 320); }
function triggerFlash(elId){ triggerFx(elId, 'flash', 420); }
function triggerKO(elId){
  const el = qs(elId);
  if(!el) return;
  const target = el.querySelector('.pixel-sprite') || el;
  target.classList.add('ko-fall');
}

function spawnPop(elId, text, cls){
  const el = qs(elId);
  if(!el) return;
  const pop = document.createElement('div');
  pop.className = 'dmg-pop '+cls;
  pop.textContent = text;
  pop.style.left = (30+Math.random()*30)+'%';
  pop.style.top = '-6px';
  el.appendChild(pop);
  setTimeout(() => pop.remove(), 950);
}

/* Click en una opción: no resuelve la pregunta todavía. Primero se detiene
   el reloj y se pide confianza (Confidence Calibration, #3/#17). El tiempo
   agotado (selectedIndex===null) salta directo a handleAnswer sin pedir
   confianza: no hay nada que calibrar si no hubo respuesta. */
function selectAnswer(selectedIndex){
  const run = S.run;
  if(!run || run.answeredCurrent || run.awaitingConfidence) return;
  clearInterval(run.timerId);
  run.awaitingConfidence = true;
  run.pendingIndex = selectedIndex;
  render();
}

function confirmConfidence(confidence){
  const run = S.run;
  if(!run || !run.awaitingConfidence) return;
  const idx = run.pendingIndex;
  run.awaitingConfidence = false;
  run.pendingIndex = null;
  handleAnswer(idx, confidence);
}

function handleAnswer(selectedIndex, confidence){
  const run = S.run;
  if(!run || run.answeredCurrent) return;
  clearInterval(run.timerId);
  const q = currentQuestion();
  const view = shuffledView(q, run.pos);
  const elapsed = Date.now() - run.cardShownAt;
  const fracRemaining = Math.max(0, (run.totalMs - elapsed)/run.totalMs);
  const correct = selectedIndex === view.correct;
  confidence = (typeof confidence === 'number') ? confidence : null;

  if(!DATA.campaign.usedQuestionIds.includes(q.id)) DATA.campaign.usedQuestionIds.push(q.id);

  // Learning Engine: registro de intento por concepto (Active Recall + calibración).
  LearningEngine.recordAttempt({
    qid: q.id, conceptIds: q.conceptIds, correct, confidence,
    ms: elapsed, difficulty: q.difficulty, knowledgeType: q.knowledgeType, context:'battle',
  });
  (q.conceptIds||[]).forEach(cid => SchedulerEngine.schedule(cid));
  run.debriefLog.push({ conceptIds: q.conceptIds, correct, confidence, knowledgeType: q.knowledgeType, difficulty: q.difficulty });

  // Daño fijo: acierto = -20 al rival, error = -20 al jugador.
  // Modificadores posibles: golpe doble (-40) por racha, bloqueo total del
  // primer error (Vanguardia) o el primer error amortiguado un 10% (Forjador).
  let dmg = 0, isCrit = false, blocked = false, reduced = false;
  if(correct){
    run.streak++; run.maxStreak = Math.max(run.maxStreak, run.streak);
    run.correctCount++;
    const cs = run.archetype.critStreak;
    isCrit = cs > 0 && run.streak % cs === 0;
    dmg = isCrit ? CRIT_DAMAGE : HIT_DAMAGE;
  } else {
    run.streak = 0;
    run.missCount++;
    if(run.freeMissLeft > 0){
      run.freeMissLeft--; blocked = true; dmg = 0;
    } else if(!run.firstMissUsed && run.archetype.firstMissDiscount > 0){
      run.firstMissUsed = true; reduced = true;
      dmg = Math.round(MISS_DAMAGE * (1 - run.archetype.firstMissDiscount));
    } else {
      dmg = MISS_DAMAGE;
    }
    if(!DATA.campaign.failedQuestionIds.includes(q.id)) DATA.campaign.failedQuestionIds.push(q.id);
  }
  run.lastBlocked = blocked;
  run.lastReduced = reduced;

  // Toda pregunta contestada en batalla se vuelve tarjeta de repaso permanente.
  // La rapidez ya no altera el daño, pero sí la calidad SM-2 de la tarjeta.
  const fast = fracRemaining > 0.78;
  const deckQuality = correct ? (fast ? 5 : 4) : (selectedIndex===null ? 1 : 2);
  scheduleDeckCard(q.id, deckQuality);
  saveData();

  run.answeredCurrent = true;
  run.selectedIndex = selectedIndex;
  run.lastCorrect = correct;
  run.lastDmg = dmg;
  run.lastCrit = isCrit;
  render();

  setTimeout(() => {
    if(!S.run) return;
    if(correct){
      run.enemy.hp = Math.max(0, run.enemy.hp - dmg);
      updateHpDom('enemy'); triggerLunge('playerBadge'); triggerShake('enemyBadge'); triggerFlash('enemyBadge');
      spawnPop('enemyBadge', '-'+dmg, isCrit?'crit hit':'hit');
    } else if(blocked){
      triggerLunge('enemyBadge'); triggerFlash('playerBadge');
      spawnPop('playerBadge', '🛡 BLOQUEADO', 'block');
    } else {
      run.player.hp = Math.max(0, run.player.hp - dmg);
      updateHpDom('player'); triggerLunge('enemyBadge'); triggerShake('playerBadge'); triggerFlash('playerBadge');
      spawnPop('playerBadge', '-'+dmg, 'hit');
    }
    const btn = qs('continueBtn');
    if(btn) setTimeout(() => btn.removeAttribute('disabled'), 250);
  }, 220);
}

function continueTurn(){
  const run = S.run;
  if(!run) return;
  if(run.enemy.hp <= 0){ triggerKO('enemyBadge'); setTimeout(handleVictory, 550); return; }
  if(run.player.hp <= 0){ triggerKO('playerBadge'); setTimeout(handleDefeat, 550); return; }
  run.pos++;
  // El mazo ya viene dimensionado para el peor caso; esto es solo una red
  // de seguridad por si el banco de preguntas fuera muy pequeño.
  if(run.pos >= run.deck.length){
    const seen = new Set(run.deck.map(q => q.id));
    const more = pickQuestionsForLevel(run.levelNum, Array.from(seen), 3);
    run.deck = run.deck.concat(more.length ? more : shuffle(activeQuestions()).slice(0,3));
  }
  run.answeredCurrent = false;
  run.selectedIndex = null;
  render();
  beginTimer();
}

function handleVictory(){
  const run = S.run;
  clearInterval(run.timerId);
  DATA.campaign.levelsCleared[run.levelNum-1] = true;
  // La curación se redondea a múltiplos de 20 para que el HP siempre
  // represente un número exacto de errores restantes.
  const healPct = 0.20 + (run.archetype.healBonus||0);
  const heal = Math.max(MISS_DAMAGE, Math.round(run.player.maxHp*healPct / MISS_DAMAGE) * MISS_DAMAGE);
  DATA.campaign.playerHp = Math.min(run.player.maxHp, run.player.hp + heal);
  if(run.levelNum >= 10) DATA.campaign.completed = true;
  saveData();
  run.phase = 'victory';
  render();
}

function handleDefeat(){
  const run = S.run;
  clearInterval(run.timerId);
  run.phase = 'defeat';
  render();
}

function goToMap(){
  // Puede llamarse en pleno combate (botón "volver al mapa" mientras corre
  // el reloj de la pregunta): hay que apagar el intervalo del temporizador,
  // si no queda corriendo en segundo plano indefinidamente.
  if(S.run) clearInterval(S.run.timerId);
  S.run = null; S.screen = 'map'; render();
}

function resetLevels(){
  DATA.campaign = freshCampaign();
  saveData();
  goToMap();
}

   personaje desde cero. El avatar anterior no se borra hasta que se
   confirme uno nuevo (mismo criterio que "Modificar avatar"): si el
   jugador se arrepiente a mitad de la creación, no pierde nada. El mazo de
   repaso y el dominio por concepto (DATA.deck / DATA.learning) NUNCA se
   tocan aquí -- son conocimiento del jugador, no progreso de la partida. */
function startNewAdventure(){
  DATA.campaign = freshCampaign();
  saveData();
  S.tempAvatar = { name:'', classId:null };
  S.screen = 'avatar';
  render();
  window.scrollTo(0,0);
}

function askConfirm(message, actionId){
  S.pendingConfirm = { message, actionId };
  render();
}
function resolveConfirm(yes){
  const pending = S.pendingConfirm;
  S.pendingConfirm = null;
  if(yes && pending){
    if(pending.actionId === 'reset-levels') resetLevels();
    else if(pending.actionId === 'new-adventure') startNewAdventure();
  }
  render();
}

/* ==================================================================
   DEBRIEF POST-COMBATE (#15)
   ------------------------------------------------------------------
   Se construye SOLO con lo que pasó en este combate (run.debriefLog),
   no con el historial global, para que se sienta un parte de batalla y
   no un dashboard genérico. Categorías = las mismas de la Sala de
   Exploración (articleStructure), así el jugador ve el mismo lenguaje
   en todo el juego.
================================================================== */
function debriefHtml(run){
  const log = run.debriefLog || [];
  if(!log.length) return '';

  const total = log.length, correct = log.filter(a=>a.correct).length;
  const accuracy = Math.round(correct/total*100);

  // Precisión por categoría de concepto (ANATOMÍA 90%, METODOLOGÍA 48%, ...)
  const structure = articleStructure(CURRENT_ARTICLE);
  const catStats = {};
  log.forEach(a => (a.conceptIds||[]).forEach(cid => {
    const c = conceptById(cid); if(!c) return;
    const cat = c.category || 'otros';
    if(!catStats[cat]) catStats[cat] = { n:0, ok:0 };
    catStats[cat].n++; if(a.correct) catStats[cat].ok++;
  }));
  const catRows = structure
    .map(s => ({ ...s, stat: catStats[s.id] }))
    .filter(s => s.stat)
    .map(s => {
      const pct = Math.round(s.stat.ok / s.stat.n * 100);
      const cls = pct >= 75 ? 'full' : pct >= 50 ? 'mid' : 'low';
      return `<div class="debrief-cat">
        <span class="debrief-cat-name">${esc(s.name)}</span>
        <div class="coverage-bar debrief-cat-bar"><div class="coverage-fill ${cls}" style="width:${pct}%;"></div></div>
        <span class="debrief-cat-pct">${pct}%</span>
      </div>`;
    }).join('');

  // Conceptos tocados en este combate: cuáles quedaron dominados / frágiles.
  const touchedIds = Array.from(new Set(log.flatMap(a => a.conceptIds||[])));
  const mastered = touchedIds.filter(cid => LearningEngine.masteryOf(cid) >= 0.75);
  const fragile  = touchedIds.filter(cid => { const s=LearningEngine.statsOf(cid); return s && s.weakness; });
  const highConfErrors = log.filter(a => !a.correct && a.confidence != null && a.confidence >= 0.75);

  const chips = (ids, cls) => ids.map(cid => {
    const c = conceptById(cid); if(!c) return '';
    return `<span class="pill ${cls}">${esc(c.title)}</span>`;
  }).join(' ');

  return `
    <div class="card-panel debrief-panel">
      <div class="eyebrow" style="margin:0 0 8px;">Parte de batalla</div>
      <div class="debrief-accuracy">Precisión general: <b>${accuracy}%</b> (${correct}/${total})</div>
      ${catRows ? `<div class="debrief-cats">${catRows}</div>` : ''}

      ${fragile.length ? `<div class="debrief-line"><span class="fb-k">Conceptos frágiles</span><div class="debrief-chips">${chips(fragile,'pill-low')}</div></div>` : ''}
      ${highConfErrors.length ? `<div class="debrief-line"><span class="fb-k">Errores con alta confianza</span><div class="debrief-chips">${chips(Array.from(new Set(highConfErrors.flatMap(a=>a.conceptIds||[]))),'pill-low')}</div><p class="muted" style="font-size:11.5px; margin:4px 0 0;">Creíste saberlo y no era así: son prioridad en tu próximo repaso.</p></div>` : ''}

}

      </div>

        <p class="lede" style="margin:14px auto 0; text-align:center;">${esc(run.def.name)} resiste. Repasa y vuelve a intentarlo.</p>
      </div>
      ${debriefHtml(run)}
      <div class="btn-row">
        <button class="btn btn-primary" data-action="start-level" data-level="${run.levelNum}">Reintentar</button>

      </div>`;
  }

  // fighting
  const q = currentQuestion();
  const view = shuffledView(q, run.pos);
  const dots = Array.from({length:3}).map((_,i)=>`<span class="${i<q.diff?'on':''}"></span>`).join('');
  const locked = run.answeredCurrent || run.awaitingConfidence;
  const optionsHtml = view.options.map((opt,i) => {
    let cls = 'option';
    if(run.answeredCurrent){
      if(i === view.correct) cls += ' correct';
      else if(i === run.selectedIndex) cls += ' wrong';
      else cls += ' dim';
    } else if(run.awaitingConfidence && i === run.pendingIndex){
      cls += ' selected';
    } else if(run.awaitingConfidence){
      cls += ' dim';
    }
    return `<button class="${cls}" data-action="answer" data-index="${i}" ${locked?'disabled':''}>
      <span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(opt)}</span>
    </button>`;
  }).join('');

  let feedback = '';
  if(run.awaitingConfidence){
    // Active Recall + Confidence Calibration: se pide confianza ANTES de
    // revelar si la respuesta fue correcta (#3, #17). Un solo toque extra.
    feedback = `
      <div class="confidence-prompt">
        <div class="confidence-q">¿Qué tan seguro estás de tu respuesta?</div>
        <div class="confidence-row">

          `).join('')}

    feedback = structuredFeedbackHtml(run, q, view);
  }

  const hitsLeft = Math.ceil(run.enemy.hp / HIT_DAMAGE);
  const isOther = q.article !== CURRENT_ARTICLE;

  return `
    <button class="footer-link" data-action="go-map" style="margin-bottom:10px;">‹ Volver al mapa</button>
    <div class="battle-frame">
      ${combatantBlock('enemy', run)}
      ${combatantBlock('player', run)}
    </div>
    <div class="hit-track">${Array.from({length:HITS_TO_WIN}).map((_,i)=>`<span class="${i < HITS_TO_WIN-hitsLeft ? 'on':''}"></span>`).join('')}
      <span class="hit-track-label">${hitsLeft} acierto${hitsLeft===1?'':'s'} para vencer</span>
    </div>
    <div class="card-panel">
      <div class="vignette-topic">
        <span class="eyebrow" style="margin:0;">${KIND_LABEL[q.kind] || 'Pregunta'}</span>
        <span class="q-meta">
          <span class="pill diff-${q.diff}">${DIFF_LABEL[q.diff]}</span>
          <span class="pill pill-quiet">${KT_LABEL[q.knowledgeType] || 'Sin clasificar'}</span>
          ${isOther ? `<span class="pill pill-review">Repaso</span>` : ''}
          <span class="diff-dots">${dots}</span>
        </span>
      </div>
      <div class="vignette">${esc(q.vignette)}</div>
      <div class="options">${optionsHtml}</div>
      ${(!run.answeredCurrent && !run.awaitingConfidence) ? `<div class="timer-bar-bg"><div class="timer-bar" id="timerBar"></div></div><div class="timer-label" id="timerLabel">${Math.ceil(run.totalMs/1000)}s</div>` : ''}
      ${feedback}
    </div>`;
}

/* Feedback estructurado (#14): no solo "correcto/incorrecto", sino por qué
   la correcta es correcta, por qué la elegida podía parecer correcta, el
   dato clave y una regla mental corta. Se degrada con elegancia si la
   pregunta es antigua y no trae feedback.distractors/keyFact/rule. */
function structuredFeedbackHtml(run, q, view){
  const verdict = run.lastCorrect ? (run.lastCrit ? '¡Golpe doble!' : '✓ Correcto') : (run.selectedIndex===null ? '✕ Tiempo agotado' : '✕ Incorrecto');
  const impact = run.lastCorrect
    ? `-${run.lastDmg} al rival`
    : run.lastBlocked ? 'Coraza: 0 de daño'
    : run.lastReduced ? `Temple: -${run.lastDmg} HP (10% menos)`
    : `-${run.lastDmg} HP propio`;

  let wrongBlock = '';
  if(!run.lastCorrect && run.selectedIndex !== null){
    const chosenOriginalIdx = shuffledOriginalIndex(q, run, view, run.selectedIndex);
    const distractorNote = q.feedback && q.feedback.distractors ? q.feedback.distractors[chosenOriginalIdx] : null;
    wrongBlock = `
      <div class="fb-row"><span class="fb-k">Tu respuesta</span><span class="fb-v bad">${esc(view.options[run.selectedIndex])}</span></div>
      <div class="fb-row"><span class="fb-k">Respuesta correcta</span><span class="fb-v ok">${esc(view.options[view.correct])}</span></div>
      ${distractorNote ? `<div class="fb-row"><span class="fb-k">Por qué parecía correcta</span><span class="fb-v">${esc(distractorNote)}</span></div>` : ''}`;
  }
  const keyFact = q.feedback && q.feedback.keyFact ? `<div class="fb-row"><span class="fb-k">Dato clave</span><span class="fb-v">${esc(q.feedback.keyFact)}</span></div>` : '';
  const rule    = q.feedback && q.feedback.rule    ? `<div class="fb-row"><span class="fb-k">Regla mental</span><span class="fb-v mono">${esc(q.feedback.rule)}</span></div>` : '';
  const concepts = (q.conceptIds||[]).map(conceptById).filter(Boolean);
  const conceptChips = concepts.map(c => `<span class="pill pill-quiet">${esc(c.title)}</span>`).join(' ');

  return `
    <div class="feedback ${run.lastCorrect?'ok':'bad'}">
      <div class="verdict">${verdict} · ${impact}</div>
      <div class="exp">${esc((q.feedback&&q.feedback.why) || q.exp)}</div>
      ${wrongBlock}
      ${keyFact}${rule}
      <div class="exp-ref">${esc(articleRef(q))}</div>
      ${conceptChips ? `<div class="fb-concepts">${conceptChips}</div>` : ''}
    </div>
    <button class="btn btn-primary btn-block" id="continueBtn" data-action="continue-turn" disabled style="margin-top:12px;">Continuar</button>`;
}
/* El índice elegido está en el espacio barajado de la vista; los
   distractores del autor están indexados por posición ORIGINAL (0-3 tal
   como se escribió la pregunta), así que hay que revertir el barajado. */
function shuffledOriginalIndex(q, run, view, shuffledIdx){
  const cache = run.shuffleCache && run.shuffleCache[run.pos];
  if(!cache) return shuffledIdx;
  const chosenText = view.options[shuffledIdx];
  return q.options.indexOf(chosenText);
}

      <div class="ankicard-face front">

        <div class="ankicard-text">${esc(q.vignette)}</div>
      </div>
      <div class="ankicard-face back">
        <div class="ankicard-answer">✓ ${esc(q.options[q.correct])}</div>
        <div class="ankicard-exp">${esc(q.exp)}</div>

}

function dueLabel(card){
  const days = Math.ceil((card.due - Date.now())/86400000);
  if(days <= 0) return 'Pendiente hoy';
  if(days === 1) return 'En 1 día';
  return 'En '+days+' días';
}

function questionsBodyHtml(){
  const stats = deckStats();
  const ids = Object.keys(DATA.deck).filter(id => byId[id]);
  // Catalogado por artículo del que salió la pregunta.
  const groups = ARTICLES.map(art => {
    const gIds = ids.filter(id => byId[id].article === art.id)
                    .sort((a,b) => DATA.deck[a].due - DATA.deck[b].due);

    const due = gIds.filter(id => DATA.deck[id].due <= Date.now()).length;
    return `
      <div class="qgroup">
        <div class="qgroup-head">
          <div>
            <div class="qgroup-name">${esc(art.name)}</div>
            <div class="qgroup-sub">${gIds.length} tarjeta${gIds.length===1?'':'s'}${due? ' · '+due+' pendiente'+(due===1?'':'s') : ''}${art.id===CURRENT_ARTICLE?' · en estudio':''}</div>

  }).join('');

  return `
    <div class="stat-row">
      <div class="stat-box"><div class="k">Pendientes hoy</div><div class="v">${stats.due}</div></div>
      <div class="stat-box"><div class="k">Dominadas</div><div class="v">${stats.mature}</div></div>
      <div class="stat-box"><div class="k">Total</div><div class="v">${stats.total}</div></div>
    </div>
    <button class="btn btn-primary btn-block" data-action="go-study" ${stats.due===0?'disabled':''}>${stats.due>0 ? 'Estudiar ahora ('+stats.due+')' : 'Sin tarjetas pendientes hoy'}</button>

      ${groups || '<p class="muted">Aún no has contestado ninguna pregunta. Juega una ronda para empezar a generar tarjetas.</p>'}
    </div>`;
}

/* Todo el banco de preguntas creado hasta ahora, jugadas o no, agrupado por
   artículo. A diferencia de "Preguntas" (que solo muestra las que ya tienen
   tarjeta porque se contestaron en batalla), aquí aparece TODO lo que existe
   en QUESTIONS -- útil para ver de un vistazo cuánto contenido hay por tema. */
function allQuestionsBodyHtml(){
  const groups = ARTICLES.map(art => {
    const qs_ = QUESTIONS.filter(q => q.article === art.id);
    if(!qs_.length) return '';
    const answered = qs_.filter(q => DATA.deck[q.id]).length;
    return `
      <div class="qgroup">
        <div class="qgroup-head">
          <div>
            <div class="qgroup-name">${esc(art.name)}</div>
            <div class="qgroup-sub">${qs_.length} pregunta${qs_.length===1?'':'s'} en el banco · ${answered} jugada${answered===1?'':'s'}${art.id===CURRENT_ARTICLE?' · en estudio':''}</div>
          </div>
        </div>
        <div class="qlist">${qs_.map(conceptQuestionRowHtml).join('')}</div>
      </div>`;
  }).join('');
  return `<div class="section" style="margin-top:18px;">${groups}</div>`;
}

function masteryBarHtml(mastery){
  const pct = Math.round(mastery*100);
  const cls = pct>=75?'full':pct>=45?'mid':'low';
  return `<div class="coverage-bar codex-bar"><div class="coverage-fill ${cls}" style="width:${pct}%;"></div></div>`;
}

/* Fila compacta de concepto para el Codex: dominio, intentos, estado. */
function conceptRowHtml(c){
  const s = LearningEngine.statsOf(c.id);
  const mastery = s ? s.mastery : 0;
  const attempts = s ? s.attempts : 0;
  const badge = !attempts ? '<span class="pill pill-quiet">Sin estudiar</span>'
    : s.weakness ? '<span class="pill pill-low">Débil</span>'
    : mastery >= 0.75 ? '<span class="pill pill-ok">Dominado</span>'
    : '<span class="pill pill-mid">En progreso</span>';
  const misc = s && s.misconception ? '<span class="pill pill-low">Falsa seguridad</span>' : '';
  return `<button class="qrow" data-action="open-concept" data-id="${esc(c.id)}">
    <div class="qrow-main">
      <div class="qrow-text">${esc(c.title)}</div>
      <div class="qrow-tags">${badge}${misc}<span class="pill pill-quiet">${attempts} intento${attempts===1?'':'s'}</span></div>
      ${masteryBarHtml(mastery)}
    </div>
    <span class="qrow-arrow">›</span>
  </button>`;
}

function codexBodyHtml(){
  const groups = ARTICLES.map(art => {
    const concepts = conceptsOf(art.id);
    if(!concepts.length) return '';
    const withData = concepts.filter(c => LearningEngine.statsOf(c.id));
    const avgMastery = withData.length ? withData.reduce((s,c)=>s+LearningEngine.masteryOf(c.id),0)/withData.length : 0;
    return `
      <div class="qgroup">
        <div class="qgroup-head">
          <div>
            <div class="qgroup-name">${esc(art.name)}</div>
            <div class="qgroup-sub">${concepts.length} concepto${concepts.length===1?'':'s'}${withData.length ? ' · dominio promedio '+Math.round(avgMastery*100)+'%' : ' · sin datos aún'}${art.id===CURRENT_ARTICLE?' · en estudio':''}</div>
          </div>
        </div>
        <div class="qlist">${concepts.map(conceptRowHtml).join('')}</div>
      </div>`;
  }).join('');
  return `<div class="section" style="margin-top:18px;">${groups}</div>`;
}

      </div>
    </div>
    <div class="card-panel">
      <div class="eyebrow" style="margin:0 0 8px;">Resumen</div>
      <div class="ficha-exp">${esc(c.summary)}</div>
    </div>
    <div class="card-panel" style="margin-top:12px;">
      <div class="eyebrow" style="margin:0 0 8px;">Dominio</div>
      ${masteryBarHtml(s?s.mastery:0)}
      <div class="coverage-line" style="margin-top:6px;">${Math.round((s?s.mastery:0)*100)}% de dominio estimado</div>
    </div>
    <div class="stat-row">
      <div class="stat-box"><div class="k">Intentos</div><div class="v">${s?s.attempts:0}</div></div>
      <div class="stat-box"><div class="k">Aciertos</div><div class="v">${s?s.correct:0}</div></div>
      <div class="stat-box"><div class="k">Calibración</div><div class="v" style="font-size:16px;">${calib==null?'—':Math.round(calib*100)+'%'}</div></div>
      <div class="stat-box"><div class="k">Próximo repaso</div><div class="v" style="font-size:13px;">${s && s.nextAt ? dueLabel({due:s.nextAt}) : 'Sin programar'}</div></div>

    ${related.length ? `<div class="section"><div class="eyebrow">Conceptos relacionados</div><div class="debrief-chips">${linkChips(related)}</div></div>` : ''}

/* Panel de cobertura: traduce el algoritmo de presupuesto a algo legible,
   para saber de un vistazo si el artículo tiene suficientes preguntas. */
function coverageHtml(articleId){
  const c = articleCoverage(articleId);
  const pct = Math.min(100, Math.round(c.have / c.need * 100));
  const ok = c.have >= c.need;
  const okish = !ok && c.have >= c.comfortable;
  return `
    <div class="coverage">
      <div class="coverage-bar"><div class="coverage-fill ${ok?'full':okish?'mid':'low'}" style="width:${pct}%;"></div></div>
      <div class="coverage-line">
        <b>${c.have}</b> de <b>${c.need}</b> preguntas para cubrir los 10 niveles sin repetir
        ${ok ? '<span class="pill pill-ok">Completo</span>' : okish ? '<span class="pill pill-mid">Jugable</span>' : '<span class="pill pill-low">Faltan '+(c.comfortable-c.have>0?c.comfortable-c.have:c.need-c.have)+'</span>'}
      </div>
      <div class="coverage-line muted">
        Fácil ${c.byDiff[1]} · Media ${c.byDiff[2]} · Difícil ${c.byDiff[3]} &nbsp;|&nbsp;
        Directas ${c.byKind.directa} · Casos ${c.byKind.caso}
      </div>
      <div class="coverage-line muted">
        Peor caso: ${c.budget.perLevelMax} preguntas por nivel · ${c.budget.campaignMax} en la campaña completa.
      </div>
    </div>`;
}

function startStudy(){
  const due = shuffle(deckDueIds());
  if(due.length === 0) return;
  S.study = { queue: due.slice(0,20), pos:0, phase:'front' };
  S.screen = 'study';
  render();
}
function rateStudyCard(quality){
  if(!S.study) return;
  const id = S.study.queue[S.study.pos];
  scheduleDeckCard(id, quality);
  S.study.pos++;
  S.study.phase = 'front';
  render();
}

    S.screen = 'splash'; render(); window.scrollTo(0,0);

/* ==================================================================
   SELF-TESTS
   ------------------------------------------------------------------
   No hay runner de tests en este proyecto (archivo único, sin build).
   Este es un harness mínimo con asserts reales que corre en el propio
   navegador: desde la consola (`PULSO.selfTest()`) o desde el panel de
   debug (?debug=1). Usa un concept id aislado con prefijo `__test_` que
   se limpia antes y después de cada caso, así nunca ensucia el dominio
   real del jugador ni las tarjetas guardadas.
================================================================== */
function selfTest(){
  const results = [];
  const t = (name, fn) => {
    try{ fn(); results.push({ name, pass:true }); }
    catch(e){ results.push({ name, pass:false, message:e.message }); }
  };
  const assert = (cond, msg) => { if(!cond) throw new Error(msg || 'assertion failed'); };

  const TCID = '__test_concept__';
  const cleanup = () => {
    delete DATA.learning.concepts[TCID];
    DATA.learning.attempts = DATA.learning.attempts.filter(a => !a.qid || !String(a.qid).startsWith('__test_q'));
  };
  cleanup();

  t('mastery: aciertos consistentes y recientes dan dominio alto', () => {
    for(let i=0;i<5;i++) LearningEngine.recordAttempt({ qid:'__test_q'+i, conceptIds:[TCID], correct:true, confidence:0.9, ms:1000, difficulty:4, knowledgeType:'application', context:'test' });
    const m = LearningEngine.masteryOf(TCID);
    assert(m > 0.7, 'esperaba mastery > 0.7, fue '+m.toFixed(3));
  });
  cleanup();

  t('mastery: un error con alta confianza marca misconception y penaliza el dominio', () => {
    LearningEngine.recordAttempt({ qid:'__test_qA', conceptIds:[TCID], correct:true, confidence:0.9, ms:1000, difficulty:3, knowledgeType:'recall', context:'test' });
    LearningEngine.recordAttempt({ qid:'__test_qB', conceptIds:[TCID], correct:true, confidence:0.9, ms:1000, difficulty:3, knowledgeType:'recall', context:'test' });
    const before = LearningEngine.masteryOf(TCID);
    LearningEngine.recordAttempt({ qid:'__test_qC', conceptIds:[TCID], correct:false, confidence:0.9, ms:1000, difficulty:3, knowledgeType:'recall', context:'test' });
    const s = LearningEngine.statsOf(TCID);
    assert(s.misconception === true, 'esperaba misconception=true');
    assert(s.mastery < before, 'el dominio debía bajar tras el error de alta confianza');
  });
  cleanup();

  t('debilidad: exige al menos 3 intentos, no se marca con solo 1 fallo', () => {
    LearningEngine.recordAttempt({ qid:'__test_qD', conceptIds:[TCID], correct:false, confidence:0.9, ms:1000, difficulty:3, knowledgeType:'recall', context:'test' });
    assert(LearningEngine.statsOf(TCID).weakness === false, 'con 1 intento no debería marcarse débil aún');
    LearningEngine.recordAttempt({ qid:'__test_qE', conceptIds:[TCID], correct:false, confidence:0.9, ms:1000, difficulty:3, knowledgeType:'recall', context:'test' });
    LearningEngine.recordAttempt({ qid:'__test_qF', conceptIds:[TCID], correct:false, confidence:0.9, ms:1000, difficulty:3, knowledgeType:'recall', context:'test' });
    assert(LearningEngine.statsOf(TCID).weakness === true, 'con 3 fallos y confianza alta debería marcarse débil');
  });
  cleanup();

  t('calibración: acierto con confianza alta + error con confianza baja = bien calibrado', () => {
    LearningEngine.recordAttempt({ qid:'__test_qG', conceptIds:[TCID], correct:true,  confidence:0.9,  ms:1000, difficulty:2, knowledgeType:'recall', context:'test' });
    LearningEngine.recordAttempt({ qid:'__test_qH', conceptIds:[TCID], correct:false, confidence:0.25, ms:1000, difficulty:2, knowledgeType:'recall', context:'test' });
    const calib = LearningEngine.calibrationOf(TCID);
    assert(calib === 1, 'esperaba calibración perfecta (2/2), fue '+calib);
  });
  cleanup();

  t('scheduler: acierto sube de peldaño, fallo reinicia al primero', () => {
    LearningEngine.recordAttempt({ qid:'__test_qI', conceptIds:[TCID], correct:true, confidence:0.9, ms:1000, difficulty:2, knowledgeType:'recall', context:'test' });
    const days1 = Math.round((SchedulerEngine.schedule(TCID)-Date.now())/86400000);
    assert(days1 === SchedulerEngine.LADDER_DAYS[0], 'primer acierto debía ir al peldaño '+SchedulerEngine.LADDER_DAYS[0]+'d, fue '+days1);
    LearningEngine.recordAttempt({ qid:'__test_qJ', conceptIds:[TCID], correct:true, confidence:0.9, ms:1000, difficulty:2, knowledgeType:'recall', context:'test' });
    const days2 = Math.round((SchedulerEngine.schedule(TCID)-Date.now())/86400000);
    assert(days2 > days1, 'un segundo acierto seguido debía alejar el repaso ('+days2+' vs '+days1+')');
    LearningEngine.recordAttempt({ qid:'__test_qK', conceptIds:[TCID], correct:false, confidence:0.9, ms:1000, difficulty:2, knowledgeType:'recall', context:'test' });
    const days3 = Math.round((SchedulerEngine.schedule(TCID)-Date.now())/86400000);
    assert(days3 === SchedulerEngine.LADDER_DAYS[0], 'un fallo debía reiniciar al primer peldaño, fue '+days3);
  });
  cleanup();

  t('scheduler: acierto con confianza baja no sube de peldaño (intervalo moderado)', () => {
    LearningEngine.recordAttempt({ qid:'__test_qL', conceptIds:[TCID], correct:true, confidence:0.9, ms:1000, difficulty:2, knowledgeType:'recall', context:'test' });
    const days1 = Math.round((SchedulerEngine.schedule(TCID)-Date.now())/86400000);
    LearningEngine.recordAttempt({ qid:'__test_qM', conceptIds:[TCID], correct:true, confidence:0.25, ms:1000, difficulty:2, knowledgeType:'recall', context:'test' });
    const days2 = Math.round((SchedulerEngine.schedule(TCID)-Date.now())/86400000);
    assert(days2 === days1, 'un acierto con baja confianza no debía subir de peldaño ('+days2+' vs '+days1+')');
  });
  cleanup();

  t('scheduler: llamar schedule() otra vez sin un intento nuevo no cambia el repaso (idempotencia)', () => {
    LearningEngine.recordAttempt({ qid:'__test_qN', conceptIds:[TCID], correct:true, confidence:0.9, ms:1000, difficulty:2, knowledgeType:'recall', context:'test' });
    const at1 = SchedulerEngine.schedule(TCID);
    const at2 = SchedulerEngine.schedule(TCID); // re-programar sin intento nuevo: p.ej. un re-render o recarga
    const at3 = SchedulerEngine.schedule(TCID);
    assert(at1 === at2 && at2 === at3, 'llamar schedule() repetidamente sin un intento nuevo no debía cambiar nextAt');
  });
  cleanup();

  t('validateQuestion: rechaza preguntas sin concepto vinculado', () => {
    const bad = { id:'__t', vignette:'x', options:['a','b','c','d'], correct:0, exp:'y', article:CURRENT_ARTICLE, difficulty:2, conceptIds:[], evidenceScope:'article', sourceRef:'r' };
    assert(!validateQuestion(bad).ok, 'una pregunta sin conceptIds no debería validar');
  });
  t('validateQuestion: rechaza preguntas factuales sin sourceRef', () => {
    const bad = { id:'__t', vignette:'x', options:['a','b','c','d'], correct:0, exp:'y', article:CURRENT_ARTICLE, difficulty:2, conceptIds:[CONCEPTS[0].id], evidenceScope:'article' };
    assert(!validateQuestion(bad).ok, 'evidenceScope=article sin sourceRef no debería validar (control anti-alucinación)');
  });
  t('validateQuestion: acepta una pregunta bien formada', () => {
    const good = { id:'__t', vignette:'x', options:['a','b','c','d'], correct:0, exp:'y', article:CURRENT_ARTICLE, difficulty:2, conceptIds:[CONCEPTS[0].id], evidenceScope:'article', sourceRef:'r' };
    const r = validateQuestion(good);
    assert(r.ok, 'debía validar: '+JSON.stringify(r.errors));
  });
  t('validateQuestion: en modo estricto exige knowledgeType y feedback', () => {
    const q = { id:'__t2', vignette:'x', options:['a','b','c','d'], correct:0, exp:'y', article:CURRENT_ARTICLE, difficulty:2, conceptIds:[CONCEPTS[0].id], evidenceScope:'article', sourceRef:'r' };
    assert(!validateQuestion(q, {strict:true}).ok, 'en modo estricto debía exigir knowledgeType y feedback');
  });

  t('migración: es idempotente (no duplica ni cambia el estado al repetirse)', () => {
    const before = JSON.stringify(DATA.learning.concepts);
    migrateLearningState();
    assert(before === JSON.stringify(DATA.learning.concepts), 'una segunda migración no debía cambiar el estado');
  });

  t('todas las preguntas del banco quedan vinculadas a algún concepto', () => {
    const huerfanas = QUESTIONS.filter(q => !q.conceptIds.length);
    assert(huerfanas.length === 0, huerfanas.length+' sin concepto: '+huerfanas.map(q=>q.id).join(', '));
  });
  t('todos los conceptos tienen al menos una pregunta vinculada', () => {
    const vacios = CONCEPTS.filter(c => !questionsOfConcept(c.id).length);
    assert(vacios.length === 0, vacios.length+' sin preguntas: '+vacios.map(c=>c.id).join(', '));
  });

  cleanup();
  saveData();
  const passed = results.filter(r=>r.pass).length;
  const summary = { total:results.length, passed, failed:results.length-passed, results };
  if(!DEBUG) console.log('[PULSO selfTest]', passed+'/'+results.length+' OK', summary);
  return summary;
}

/* API mínima expuesta a la consola para depurar sin exponer nada al
   jugador normal: window.PULSO.selfTest(), .LearningEngine, etc. */
window.PULSO = {
  selfTest, LearningEngine, SchedulerEngine, CONCEPTS, QUESTIONS,
  validateQuestion, conceptById, questionsOfConcept,
  data: () => DATA,
};

/* ==================================================================
   PANEL DE DEBUG (?debug=1) — nunca visible al jugador normal.
   Muestra el estado crudo del Learning/Scheduler Engine por concepto y
   permite correr los self-tests desde la UI en vez de la consola.
================================================================== */
function screenDebug(){
  const rows = CONCEPTS.map(c => {
    const s = DATA.learning.concepts[c.id];
    return { c, s };
  }).sort((a,b) => (b.s?b.s.attempts:0) - (a.s?a.s.attempts:0));

  const tableRows = rows.map(({c,s}) => `
    <tr>
      <td>${esc(c.id)}</td>
      <td>${esc(c.title)}</td>
      <td>${s ? s.attempts : 0}</td>
      <td>${s ? s.correct : 0}</td>
      <td>${s ? (s.mastery*100).toFixed(1)+'%' : '—'}</td>
      <td>${s && s.calibrationTotal ? Math.round(s.calibrationHits/s.calibrationTotal*100)+'%' : '—'}</td>
      <td>${s && s.weakness ? 'sí' : 'no'}</td>
      <td>${s && s.misconception ? 'sí' : 'no'}</td>
      <td>${s && s.nextAt ? new Date(s.nextAt).toISOString().slice(0,10) : '—'}</td>
      <td>${s ? s.stability.toFixed(1) : '—'}</td>
    </tr>`).join('');

  const test = S.debugTestResult;
  const testHtml = test ? `
    <div class="card-panel" style="margin-top:12px;">
      <div class="eyebrow" style="margin:0 0 8px;">Self-test: ${test.passed}/${test.total} OK</div>
      <div class="debug-wrap"><table class="debug-table">
        <tr><th>Caso</th><th>Resultado</th></tr>
        ${test.results.map(r => `<tr><td>${esc(r.name)}</td><td class="${r.pass?'debug-pass':'debug-fail'}">${r.pass?'PASS':'FAIL: '+esc(r.message||'')}</td></tr>`).join('')}
      </table></div>
    </div>` : '';

  return `
    <div class="section">
      <div class="eyebrow">Panel de debug</div>
      <h1 class="pixel-text" style="font-size:20px;">Learning Engine</h1>
      <p class="lede">Solo visible con ?debug=1 en la URL. Estado crudo por concepto para depurar el algoritmo adaptativo.</p>
    </div>
    <button class="btn btn-primary" data-action="run-self-test">Correr self-tests</button>
    ${testHtml}
    <div class="card-panel" style="margin-top:14px;">
      <div class="eyebrow" style="margin:0 0 8px;">Conceptos (${CONCEPTS.length}) · artículo activo: ${esc(CURRENT_ARTICLE)}</div>
      <div class="debug-wrap"><table class="debug-table">
        <tr><th>ID</th><th>Título</th><th>Intentos</th><th>Aciertos</th><th>Mastery</th><th>Calib.</th><th>Débil</th><th>Misconc.</th><th>Próx. repaso</th><th>Estabilidad</th></tr>
        ${tableRows}
      </table></div>
    </div>
    <div class="btn-row" style="margin-top:14px;">
      <button class="btn" data-action="go-map">Volver al mapa</button>
      <button class="footer-link" data-action="go-home">🏠 Inicio</button>
    </div>`;
}

render();
if(DEBUG){
  // Corre los self-tests una vez al cargar en modo debug, para detectar
  // regresiones apenas se abre la URL con ?debug=1.
  S.debugTestResult = selfTest();
}
</script>
