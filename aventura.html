<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cardioaventura · Aventura de Cardiología</title>
</head>
<body>
<style>
  :root{
    --bg:#f4ecd8;
    --bg-panel:#fbf5e6;
    --bg-panel-2:#eee0c0;
    --bg-panel-3:#e4d2a3;
    --gold:#9c6d1e;
    --gold-soft: rgba(156,109,30,0.14);
    --ink:#3a2a1a;
    --ink-muted:#8a7454;
    --danger:#a5333b;
    --danger-soft: rgba(165,51,59,0.14);
    --success:#2f7a56;
    --success-soft: rgba(47,122,86,0.14);
    --border: rgba(156,109,30,0.32);
    --shadow: 0 18px 40px -20px rgba(58,42,26,0.4);
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Consolas, monospace;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans: -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#120c1e;
      --bg-panel:#1c1430;
      --bg-panel-2:#241a3d;
      --bg-panel-3:#2d2049;
      --gold:#e8b34d;
      --gold-soft: rgba(232,179,77,0.16);
      --ink:#f4eefc;
      --ink-muted:#a698c4;
      --danger:#ff5f68;
      --danger-soft: rgba(255,95,104,0.18);
      --success:#3ee6a8;
      --success-soft: rgba(62,230,168,0.16);
      --border: rgba(232,179,77,0.28);
      --shadow: 0 18px 44px -20px rgba(0,0,0,0.65);
    }
  }
  :root[data-theme="light"]{
    --bg:#f4ecd8; --bg-panel:#fbf5e6; --bg-panel-2:#eee0c0; --bg-panel-3:#e4d2a3;
    --gold:#9c6d1e; --gold-soft: rgba(156,109,30,0.14);
    --ink:#3a2a1a; --ink-muted:#8a7454;
    --danger:#a5333b; --danger-soft: rgba(165,51,59,0.14);
    --success:#2f7a56; --success-soft: rgba(47,122,86,0.14);
    --border: rgba(156,109,30,0.32); --shadow: 0 18px 40px -20px rgba(58,42,26,0.4);
  }
  :root[data-theme="dark"]{
    --bg:#120c1e; --bg-panel:#1c1430; --bg-panel-2:#241a3d; --bg-panel-3:#2d2049;
    --gold:#e8b34d; --gold-soft: rgba(232,179,77,0.16);
    --ink:#f4eefc; --ink-muted:#a698c4;
    --danger:#ff5f68; --danger-soft: rgba(255,95,104,0.18);
    --success:#3ee6a8; --success-soft: rgba(62,230,168,0.16);
    --border: rgba(232,179,77,0.28); --shadow: 0 18px 44px -20px rgba(0,0,0,0.65);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
    display:flex; justify-content:center; align-items:flex-start; min-height:100vh;
    padding:20px 14px 60px;
  }
  button{ font-family:inherit; }
  ::selection{ background:var(--gold-soft); }
  :focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  .arena{
    width:100%; max-width:760px; background:var(--bg-panel);
    border:1px solid var(--border); box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .arena::before{
    content:''; position:absolute; inset:0; pointer-events:none; opacity:.5;
    background-image: radial-gradient(circle at 1px 1px, var(--border) 1px, transparent 0);
    background-size: 22px 22px;
  }
  .arena-inner{ position:relative; z-index:1; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; border-bottom:2px solid var(--border); background:var(--bg-panel-2);
  }
  .brand{ display:flex; flex-direction:column; line-height:1.05; }
  .brand-mark{ font-family:var(--sans); font-weight:800; font-size:20px; letter-spacing:.03em; color:var(--gold); text-transform:uppercase; }
  .brand-sub{ font-family:var(--mono); font-size:10px; letter-spacing:.12em; color:var(--ink-muted); text-transform:uppercase; margin-top:3px; }
  .topbar-stats{ display:flex; gap:8px; }
  .chip{
    display:flex; align-items:center; gap:6px; border:1px solid var(--border);
    padding:5px 10px; font-family:var(--mono); font-size:12px; color:var(--ink-muted); background:var(--bg-panel);
  }
  .chip b{ color:var(--ink); font-variant-numeric:tabular-nums; font-weight:700; }

  .app{ padding:20px 18px 26px; position:relative; z-index:1; }

  h1,h2,h3{ font-family:var(--sans); font-weight:800; text-transform:uppercase; letter-spacing:.02em; text-wrap:balance; margin:0 0 6px; }
  .eyebrow{ font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); margin:0 0 8px; }
  p{ margin:0 0 10px; }
  .muted{ color:var(--ink-muted); }
  .lede{ font-family:var(--serif); font-size:15px; line-height:1.55; color:var(--ink-muted); max-width:60ch; }

  .btn{
    border:2px solid var(--ink); background:var(--bg-panel-3); color:var(--ink);
    padding:13px 20px; font-family:var(--sans); font-weight:800; font-size:13px; letter-spacing:.05em;
    text-transform:uppercase; cursor:pointer; transition:transform .06s ease, box-shadow .15s ease;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .btn:hover{ transform:translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); }
  .btn:active{ transform:translate(1px,1px); box-shadow: 1px 1px 0 var(--ink); }
  .btn-primary{ background:var(--gold); border-color:var(--ink); }
  .btn-block{ width:100%; }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .btn[disabled]{ opacity:.4; cursor:default; pointer-events:none; box-shadow:none; }
  .btn-ghost{ background:transparent; border-color:var(--border); box-shadow:none; color:var(--ink-muted); }
  .btn-ghost:hover{ box-shadow:none; transform:none; background:var(--gold-soft); }

  .section{ margin-bottom:22px; }

  /* ---- portada / pantalla de presentación ---- */
  .splash{ margin:-6px 0 -12px; }
  .splash-hero{ text-align:center; padding:22px 6px 4px; }
  .splash-flourish{ color:var(--gold); letter-spacing:.5em; font-size:11px; margin-bottom:14px; opacity:.75; }
  .splash-eyebrow{ font-family:var(--mono); font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-muted); margin-bottom:10px; }
  .splash-logo{ display:block; width:100%; max-width:620px; height:auto; margin:0 auto; }
  .splash-tagline{ font-family:var(--serif); font-size:14.5px; line-height:1.6; color:var(--ink-muted); max-width:42ch; margin:16px auto 0; }

  .splash-parade{
    overflow:hidden; margin:26px -18px; padding:16px 0;
    background:var(--bg-panel-2); border-top:2px solid var(--border); border-bottom:2px solid var(--border);
    -webkit-mask-image:linear-gradient(to right, transparent 0, #000 8%, #000 92%, transparent 100%);
    mask-image:linear-gradient(to right, transparent 0, #000 8%, #000 92%, transparent 100%);
  }
  .splash-parade-track{ display:flex; align-items:center; gap:16px; width:max-content; animation:paradeScroll 30s linear infinite; }
  @keyframes paradeScroll{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
  .parade-badge{
    flex:0 0 auto; width:66px; height:66px; border-radius:50%; border:2px solid;
    display:flex; align-items:center; justify-content:center;
  }

  .splash-actions{ display:flex; flex-direction:column; gap:10px; margin-top:8px; }

  @media (prefers-reduced-motion: reduce){
    .splash-parade-track{ animation:none; }
  }

  /* ---- avatar creation ---- */
  .field-label{ font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-muted); margin-bottom:6px; display:block; }
  .name-input{
    width:100%; border:2px solid var(--ink); background:var(--bg-panel); color:var(--ink);
    padding:12px 14px; font-family:var(--sans); font-size:16px; font-weight:600;
  }
  .archetype-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:10px; margin-top:12px; }
  .archetype-card{
    border:2px solid var(--border); background:var(--bg-panel); padding:14px; cursor:pointer; text-align:left;
    display:flex; flex-direction:column; gap:8px;
  }
  .archetype-card.selected{ border-color:var(--ink); box-shadow:3px 3px 0 var(--ink); }
  .arch-top{ display:flex; align-items:center; gap:10px; }
  .arch-badge{
    width:58px; height:58px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:22px; flex-shrink:0; border:2px solid rgba(0,0,0,0.15);
  }
  .arch-name{ font-family:var(--sans); font-weight:800; font-size:14px; text-transform:uppercase; }
  .arch-trait{ font-size:12px; color:var(--ink-muted); line-height:1.4; }
  .arch-stats{ font-family:var(--mono); font-size:11px; line-height:1.5; color:var(--ink-muted); }
  .arch-stats b{ color:var(--ink); }

  /* ---- pixel sprites ---- */
  .pixel-sprite{ position:relative; image-rendering:pixelated; }
  .pixel-sprite i{ display:block; }
  .pixel-sprite.idle{ animation:spritebob 1.1s steps(2) infinite; }
  @keyframes spritebob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-2px); } }
  .pixel-sprite.lunge{ animation:lunge .3s ease; }
  @keyframes lunge{ 0%{transform:scale(1);} 40%{transform:scale(1.18) rotate(-3deg);} 100%{transform:scale(1);} }
  .pixel-sprite.flash{ animation:hitflash .4s steps(1); }
  @keyframes hitflash{ 0%,100%{filter:none;} 25%,75%{filter:brightness(4) saturate(0);} 50%{filter:brightness(.3);} }
  .pixel-sprite.shake{ animation:hitshake .35s ease; }
  @keyframes hitshake{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-6px);} 40%{transform:translateX(5px);} 60%{transform:translateX(-4px);} 80%{transform:translateX(3px);} }
  .pixel-sprite.ko-fall{ animation:kofall .6s ease forwards; }
  @keyframes kofall{ to{ transform:rotate(85deg) translateY(8px); opacity:.12; } }
  .pixel-sprite.victory-bounce{ animation:victorybounce .6s ease infinite; }
  @keyframes victorybounce{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
  /* El arte tiene bordes suavizados, así que se reduce con interpolación
     normal en vez de "pixelated" (que produciría escalones sucios). */
  .pixel-sprite.img{ image-rendering:auto; }
  .pixel-sprite.img img{ width:100%; height:100%; display:block; object-fit:contain; image-rendering:auto; user-select:none; }

  /* ---- etiquetas de dificultad / tipo ---- */
  .pill{
    display:inline-block; font-family:var(--mono); font-size:10px; letter-spacing:.06em;
    text-transform:uppercase; padding:3px 7px; border:1px solid var(--border);
    background:var(--bg-panel); color:var(--ink-muted); white-space:nowrap;
  }
  .pill.diff-1{ border-color:var(--success); color:var(--success); background:var(--success-soft); }
  .pill.diff-2{ border-color:var(--gold);    color:var(--gold);    background:var(--gold-soft); }
  .pill.diff-3{ border-color:var(--danger);  color:var(--danger);  background:var(--danger-soft); }
  .pill-quiet{ opacity:.75; }
  .pill-review{ border-color:var(--gold); color:var(--gold); }
  .pill-due{ border-color:var(--danger); color:var(--danger); }
  .pill-ok{ border-color:var(--success); color:var(--success); background:var(--success-soft); }
  .pill-mid{ border-color:var(--gold); color:var(--gold); background:var(--gold-soft); }
  .pill-low{ border-color:var(--danger); color:var(--danger); background:var(--danger-soft); }
  .q-meta{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }

  /* ---- marcador de aciertos del combate ---- */
  .hit-track{ display:flex; align-items:center; gap:6px; margin:10px 0 4px; }
  .hit-track span{ width:26px; height:8px; background:var(--border); border:1px solid var(--border); }
  .hit-track span.on{ background:var(--danger); border-color:var(--danger); }
  .hit-track-label{ width:auto !important; height:auto !important; background:none !important; border:none !important;
    font-family:var(--mono); font-size:10.5px; color:var(--ink-muted); letter-spacing:.06em; margin-left:4px; }

  .exp-ref{ font-family:var(--mono); font-size:10.5px; line-height:1.5; color:var(--ink-muted); margin-top:8px;
    border-top:1px dashed var(--border); padding-top:8px; }
  .ankicard-ref{ font-family:var(--mono); font-size:10px; line-height:1.5; color:var(--ink-muted); margin-top:auto; }

  /* ---- lista del cuaderno agrupada por artículo ---- */
  .qgroup{ margin-bottom:22px; }
  .qgroup-head{ border-bottom:2px solid var(--ink); padding-bottom:6px; margin-bottom:2px; }
  .qgroup-name{ font-family:var(--sans); font-weight:800; font-size:14px; letter-spacing:.02em; }
  .qgroup-sub{ font-family:var(--mono); font-size:10.5px; color:var(--ink-muted); letter-spacing:.06em; text-transform:uppercase; margin-top:3px; }
  .qlist{ display:flex; flex-direction:column; }
  .qrow{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left; cursor:pointer;
    background:none; border:none; border-bottom:1px solid var(--border); padding:12px 2px; color:inherit;
  }
  .qrow:hover{ background:var(--gold-soft); }
  .qrow.due{ border-left:3px solid var(--danger); padding-left:8px; }
  .qrow-main{ flex:1; min-width:0; }
  .qrow-text{ font-family:var(--serif); font-size:13.5px; line-height:1.45;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .qrow-tags{ display:flex; gap:5px; flex-wrap:wrap; margin-top:7px; }
  .qrow-arrow{ font-size:22px; color:var(--ink-muted); line-height:1; }

  /* ---- ficha completa de una pregunta ---- */
  .ficha-tags{ display:flex; gap:6px; flex-wrap:wrap; }
  .ficha-q{ font-family:var(--serif); font-size:16px; line-height:1.6; }
  .ficha-opts{ display:flex; flex-direction:column; gap:6px; }
  .ficha-opt{ display:flex; align-items:flex-start; gap:8px; padding:9px 10px; border:1px solid var(--border);
    font-size:13.5px; line-height:1.45; opacity:.6; }
  .ficha-opt.ok{ border-color:var(--success); background:var(--success-soft); opacity:1; font-weight:600; }
  .ficha-opt .letter{ font-family:var(--mono); font-size:11px; opacity:.7; }
  .ficha-check{ margin-left:auto; color:var(--success); font-weight:700; }
  .ficha-exp{ font-family:var(--serif); font-size:14px; line-height:1.6; }
  .ficha-ref{ font-family:var(--mono); font-size:11.5px; line-height:1.6; color:var(--ink-muted); }

  /* ---- cobertura del artículo ---- */
  .coverage{ margin-top:12px; }
  .coverage-bar{ height:8px; background:var(--border); overflow:hidden; }
  .coverage-fill{ height:100%; transition:width .4s ease; }
  .coverage-fill.full{ background:var(--success); }
  .coverage-fill.mid{ background:var(--gold); }
  .coverage-fill.low{ background:var(--danger); }
  .coverage-line{ font-family:var(--mono); font-size:11px; line-height:1.7; margin-top:6px;
    display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .rules{ margin:0; padding-left:18px; font-size:13px; line-height:1.7; }
  .rules li{ margin-bottom:4px; }
  .dmg-pop.block{ color:var(--gold); font-size:13px; }

  /* ---- tabs (cuaderno / codex) ---- */
  .tab-row{ display:flex; gap:6px; border-bottom:2px solid var(--border); margin-bottom:14px; }
  .tab-btn{ background:none; border:none; border-bottom:2px solid transparent; margin-bottom:-2px;
    padding:9px 4px; font-family:var(--sans); font-weight:700; font-size:12.5px; letter-spacing:.03em;
    text-transform:uppercase; color:var(--ink-muted); cursor:pointer; }
  .tab-btn.active{ color:var(--gold); border-bottom-color:var(--gold); }
  .codex-bar{ margin-top:8px; max-width:220px; }

  /* ---- panel de debug ---- */
  .debug-table{ width:100%; border-collapse:collapse; font-family:var(--mono); font-size:11px; }
  .debug-table th, .debug-table td{ text-align:left; padding:6px 8px; border-bottom:1px solid var(--border); white-space:nowrap; }
  .debug-table th{ color:var(--ink-muted); font-weight:600; text-transform:uppercase; font-size:9.5px; letter-spacing:.06em; }
  .debug-wrap{ overflow-x:auto; }
  .debug-pass{ color:var(--success); }
  .debug-fail{ color:var(--danger); font-weight:700; }

  .scanlines{ position:absolute; inset:0; pointer-events:none; z-index:2;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,0.09) 0 1px, transparent 1px 3px);
    mix-blend-mode:multiply; opacity:.55;
  }
  .pixel-text{ text-shadow:2px 2px 0 rgba(0,0,0,0.25); }

  /* ---- world map (adventure path) ---- */
  .map-terrain{
    position:relative; height:820px; margin-top:10px; border:3px solid var(--ink); overflow:hidden;
    background:linear-gradient(to bottom, #7ec36a 0%, #7ec36a 26%, #d9b45f 48%, #b9c2cf 70%, #545a72 100%);
  }
  @media (prefers-color-scheme: dark){ .map-terrain{ filter:brightness(.72) saturate(1.05); } }
  :root[data-theme="dark"] .map-terrain{ filter:brightness(.72) saturate(1.05); }
  :root[data-theme="light"] .map-terrain{ filter:none; }
  .map-terrain::before{
    content:''; position:absolute; inset:0; opacity:.35; pointer-events:none;
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.09) 0 3px, transparent 3px 9px),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.09) 0 3px, transparent 3px 9px);
  }
  .map-path-svg{ position:absolute; inset:0; width:100%; height:100%; z-index:1; }
  .map-node{
    position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center;
    gap:4px; cursor:pointer; z-index:3; background:none; border:none; padding:0;
  }
  .map-node[disabled]{ cursor:default; }
  .node-plate{
    width:52px; height:52px; border-radius:50%; border:3px solid #241f18; background:#e9dfc0;
    display:flex; align-items:center; justify-content:center; box-shadow:0 3px 0 rgba(0,0,0,.4); position:relative;
  }
  .map-node.locked .node-plate{ filter:grayscale(1) brightness(.65); }
  .map-node.cleared .node-plate{ border-color:var(--success); }
  .map-node.current .node-plate{ animation:nodepulse 1.4s ease infinite; }
  @keyframes nodepulse{
    0%,100%{ box-shadow:0 3px 0 rgba(0,0,0,.4), 0 0 0 0 rgba(255,200,60,.65); }
    50%{ box-shadow:0 3px 0 rgba(0,0,0,.4), 0 0 0 9px rgba(255,200,60,0); }
  }
  .map-node:not(.locked):hover .node-plate{ transform:scale(1.08); }
  .node-tag{ font-family:var(--mono); font-size:9.5px; background:rgba(20,15,10,.72); color:#fff; padding:2px 6px; white-space:nowrap; }
  .node-tag.lvl{ background:rgba(20,15,10,.5); font-size:9px; }
  /* El jugador se planta a un costado del nodo para no tapar al rival. */
  .map-player-marker{ position:absolute; transform:translate(-122%,-78%); z-index:4; transition:left .6s ease, top .6s ease; pointer-events:none; }
  .map-legend{ display:flex; gap:14px; flex-wrap:wrap; margin-top:12px; font-family:var(--mono); font-size:11px; color:var(--ink-muted); }

  /* ---- battle ---- */
  .combatant{ display:flex; align-items:center; gap:12px; margin-bottom:6px; }
  .combatant.enemy{ flex-direction:row-reverse; text-align:right; }
  .combatant-badge{
    width:88px; height:88px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; border:3px solid var(--ink); background:var(--bg-panel-3); position:relative;
  }
  .combatant-meta{ flex:1; }
  .combatant-name{ font-family:var(--sans); font-weight:800; font-size:13px; text-transform:uppercase; letter-spacing:.02em; }
  .combatant-class{ font-family:var(--mono); font-size:10px; color:var(--ink-muted); text-transform:uppercase; }
  .hp-track{ height:12px; background:var(--bg-panel-2); border:1px solid var(--ink); margin-top:4px; position:relative; overflow:hidden; }
  .hp-fill{ height:100%; background:var(--success); transition:width .3s ease, background .3s ease; }
  .hp-fill.low{ background:var(--danger); }
  .hp-label{ font-family:var(--mono); font-size:10px; color:var(--ink-muted); margin-top:2px; text-align:right; }
  .battle-frame{ position:relative; padding:16px; border:2px solid var(--border); background:var(--bg-panel-2); margin-bottom:16px; }
  .dmg-pop{
    position:absolute; font-family:var(--mono); font-weight:800; font-size:20px; pointer-events:none;
    animation:dmgfloat .9s ease forwards; z-index:5;
  }
  .dmg-pop.crit{ font-size:28px; }
  .dmg-pop.heal{ color:var(--success); }
  .dmg-pop.hit{ color:var(--danger); }
  @keyframes dmgfloat{ 0%{ opacity:1; transform:translateY(0); } 100%{ opacity:0; transform:translateY(-36px); } }

  .card-panel{ border:2px solid var(--border); background:var(--bg-panel); padding:16px; }
  .diff-dots span{ display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--border); margin-left:3px; }
  .diff-dots span.on{ background:var(--gold); }
  .vignette-topic{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .vignette{ font-family:var(--serif); font-size:16.5px; line-height:1.55; max-width:65ch; }

  .options{ display:flex; flex-direction:column; gap:8px; margin-top:14px; }

    text-align:left; border:2px solid var(--border); background:var(--bg-panel); color:var(--ink);

  /* ---- confianza (Confidence Calibration) ---- */

  .feedback.ok .verdict{ color:var(--success); }
  .feedback.bad .verdict{ color:var(--danger); }

  /* ---- feedback estructurado ---- */
  .fb-row{ display:flex; gap:8px; margin-top:8px; padding-top:8px; border-top:1px dashed var(--border); font-size:13px; line-height:1.5; }

  .fb-v.ok{ color:var(--success); font-weight:700; }
  .fb-v.bad{ color:var(--danger); font-weight:700; }

  /* ---- debrief post-combate ---- */
  .debrief-panel{ margin-top:14px; }
  .debrief-accuracy{ font-family:var(--sans); font-size:14px; margin-bottom:10px; }
  .debrief-cats{ display:flex; flex-direction:column; gap:7px; margin-bottom:6px; }
  .debrief-cat{ display:flex; align-items:center; gap:8px; }
  .debrief-cat-name{ font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-muted); flex:0 0 128px; }
  .debrief-cat-bar{ flex:1; }
  .debrief-cat-pct{ font-family:var(--mono); font-size:11px; width:34px; text-align:right; }
  .debrief-line{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); }

  .timer-bar-bg{ height:6px; background:var(--border); width:100%; margin:10px 0 0; }
  .timer-bar{ height:100%; background:var(--gold); width:100%; transition:width .1s linear, background .2s ease; }
  .timer-label{ font-family:var(--mono); font-size:11px; color:var(--ink-muted); text-align:right; }

  .banner{
    text-align:center; padding:28px 16px; border:2px solid var(--ink); background:var(--bg-panel-3); margin-bottom:16px;
  }
  .banner .big{ font-family:var(--sans); font-weight:800; font-size:28px; text-transform:uppercase; letter-spacing:.02em; }
  .banner.win .big{ color:var(--success); }
  .banner.lose .big{ color:var(--danger); }

  .stat-row{ display:flex; gap:10px; flex-wrap:wrap; margin:14px 0; }

  .stat-box .k{ font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-muted); }
  .stat-box .v{ font-family:var(--mono); font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:2px; }

  .review-row{ display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
  .review-row:last-child{ border-bottom:none; }
  .review-q{ font-family:var(--serif); font-size:14px; line-height:1.5; }
  .review-a{ font-family:var(--mono); font-size:12px; color:var(--success); margin-top:4px; }

  /* ---- tarjetas tipo Anki ---- */
  .ankicard-grid{ display:grid; grid-template-columns:1fr; gap:10px; margin-top:10px; }
  .ankicard-wrap{ background:none; border:none; padding:0; cursor:pointer; text-align:left; display:block; width:100%; }
  .ankicard{ perspective:1200px; width:100%; }
  .ankicard-inner{
    position:relative; width:100%; min-height:96px; transition:transform .5s cubic-bezier(.2,.7,.3,1);
    transform-style:preserve-3d;
  }
  .ankicard.flipped .ankicard-inner{ transform:rotateY(180deg); }
  .ankicard-face{
    position:absolute; inset:0; backface-visibility:hidden; border:2px solid var(--border);
    background:var(--bg-panel); padding:14px; display:flex; flex-direction:column; gap:8px; overflow:auto;
  }
  .ankicard-face.back{ transform:rotateY(180deg); border-color:var(--success); background:var(--success-soft); }
  .ankicard-tag{ font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); }
  .ankicard-text{ font-family:var(--serif); font-size:14px; line-height:1.5; }
  .ankicard-answer{ font-family:var(--mono); font-weight:700; color:var(--success); font-size:13px; }
  .ankicard-exp{ font-size:13px; line-height:1.5; font-family:var(--serif); }
  .ankicard.small .ankicard-inner{ min-height:76px; }
  .ankicard.small .ankicard-text{ font-size:12.5px; -webkit-line-clamp:3; display:-webkit-box; -webkit-box-orient:vertical; overflow:hidden; }
  .ankicard.big .ankicard-inner{ min-height:220px; }
  .ankicard.big .ankicard-text{ font-size:17px; }

  .rate-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:14px; }
  .rate-row .btn{ padding:12px 6px; font-size:11px; }
  .rate-again{ background:var(--danger-soft); border-color:var(--danger); color:var(--danger); }
  .rate-hard{ background:var(--amber-soft, var(--gold-soft)); border-color:var(--gold); color:var(--gold); }
  .rate-good{ background:var(--success-soft); border-color:var(--success); color:var(--success); }
  .rate-easy{ background:var(--gold); border-color:var(--ink); color:var(--bg-panel); }

  /* ---- modal de confirmación ---- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,7,4,0.55); display:flex; align-items:center;
    justify-content:center; z-index:100; padding:20px;
  }
  .modal-box{
    background:var(--bg-panel); border:2px solid var(--ink); box-shadow:var(--shadow);
    padding:20px; max-width:360px; width:100%;
  }
  .modal-box p{ font-family:var(--serif); font-size:15px; line-height:1.5; margin:0 0 16px; }

  .footer-link{ font-family:var(--mono); font-size:11px; color:var(--ink-muted); text-decoration:underline; cursor:pointer; background:none; border:none; padding:0; }

    .timer-bar{ transition:none; } .combatant-badge.shake{ animation:none; } .dmg-pop{ animation:none; }

<script>
/* ------------------------------------------------------------------
   BANCO DE PREGUNTAS
   Para agregar preguntas propias: añade un objeto al arreglo QUESTIONS
   con la misma forma { id, topic, diff (1-3), vignette, options[4],
   correct (indice 0-3), exp }. El "topic" debe coincidir con un id
   de TOPICS. No hace falta tocar nada más del archivo.
------------------------------------------------------------------- */
const TOPICS = [
  { id:'arritmias',    name:'Arritmias',              glyph:'♥' },
  { id:'isquemica',    name:'Cardiopatía isquémica',  glyph:'⚡' },
  { id:'ic',           name:'Insuficiencia cardiaca', glyph:'≈' },
  { id:'valvular',     name:'Valvulopatías',          glyph:'○' },
  { id:'has',          name:'Hipertensión arterial',  glyph:'↑' },
  { id:'congenitas',   name:'Cardiopatías congénitas',glyph:'✦' },
  { id:'endocarditis', name:'Endocarditis',           glyph:'☀' },
  { id:'pericardio',   name:'Pericardio',             glyph:'◯' },
  { id:'reumatica',    name:'Fiebre reumática',       glyph:'♨' },
  { id:'shock',        name:'Shock cardiogénico',     glyph:'☇' },
  { id:'miocardio',    name:'Miocardiopatías',        glyph:'◈' },
  { id:'ecg',          name:'ECG básico',             glyph:'∿' },
  { id:'ecopediatrica', name:'Eco pediátrica (ASE 2024)', glyph:'◎' },
];

const BASE_CARDIO = [
  // ARRITMIAS
  { id:'arr-1', topic:'arritmias', diff:2, vignette:'Mujer de 68 años con fibrilación auricular de respuesta ventricular rápida, TA 78/50 mmHg y estado mental alterado. ¿Manejo inicial más adecuado?', options:['Digoxina IV','Cardioversión eléctrica sincronizada inmediata','Amiodarona oral','Anticoagulación con warfarina'], correct:1, exp:'Inestabilidad hemodinámica (hipotensión, alteración del estado mental) obliga a cardioversión eléctrica sincronizada inmediata, sin esperar anticoagulación ni fármacos orales.' },
  { id:'arr-2', topic:'arritmias', diff:1, vignette:'Varón de 60 años con fibrilación auricular hemodinámicamente estable, FC 140 lpm. ¿Cuál es el objetivo inicial del tratamiento?', options:['Cardioversión eléctrica urgente','Control de frecuencia con betabloqueador o calcioantagonista','Ablación por catéter urgente','Marcapasos definitivo'], correct:1, exp:'En FA estable, la estrategia inicial es controlar la frecuencia (betabloqueador o calcioantagonista no dihidropiridínico) y valorar anticoagulación según CHA2DS2-VASc.' },
  { id:'arr-3', topic:'arritmias', diff:2, vignette:'Paciente de 24 años con taquicardia supraventricular paroxística estable, FC 180 lpm, sin datos de compromiso hemodinámico. ¿Primer paso terapéutico?', options:['Adenosina IV en bolo','Cardioversión eléctrica','Maniobras vagales (Valsalva o masaje carotídeo)','Amiodarona IV'], correct:2, exp:'En TSV estable, se inician maniobras vagales antes que la farmacoterapia; si fallan, el siguiente paso es adenosina IV.' },
  { id:'arr-4', topic:'arritmias', diff:3, vignette:'Paciente con taquicardia de complejo ancho, monomórfica, FC 190 lpm, con dolor torácico y TA 82/56 mmHg. ¿Conducta inmediata?', options:['Amiodarona IV en infusión','Cardioversión eléctrica sincronizada','Lidocaína IV','Observación y ECG seriado'], correct:1, exp:'TV con pulso pero inestable (hipotensión, dolor torácico) requiere cardioversión sincronizada inmediata.' },
  { id:'arr-5', topic:'arritmias', diff:2, vignette:'Paciente en paro cardiorrespiratorio; el monitor muestra fibrilación ventricular. ¿Manejo inmediato?', options:['Desfibrilación no sincronizada + RCP de alta calidad','Cardioversión sincronizada','Adenosina IV','Marcapasos transcutáneo'], correct:0, exp:'FV y TV sin pulso se tratan con desfibrilación no sincronizada intercalada con compresiones de alta calidad, según el algoritmo de RCP avanzada.' },
  { id:'arr-6', topic:'arritmias', diff:2, vignette:'Varón de 75 años con síncope, ECG con bloqueo AV completo (disociación P-QRS) y FC de escape 35 lpm sintomática. ¿Tratamiento definitivo?', options:['Atropina IV en infusión continua','Marcapasos transcutáneo temporal y luego definitivo','Betabloqueador','Digoxina'], correct:1, exp:'El bloqueo AV completo sintomático es indicación de marcapasos; de forma urgente se usa marcapasos transcutáneo/transvenoso como puente al definitivo.' },
  { id:'arr-7', topic:'arritmias', diff:3, vignette:'Paciente con Wolff-Parkinson-White conocido desarrolla fibrilación auricular con conducción por vía accesoria, QRS ancho e irregular. ¿Qué fármaco debe evitarse?', options:['Procainamida','Amiodarona','Digoxina o verapamilo (bloqueadores del nodo AV)','Cardioversión eléctrica'], correct:2, exp:'En FA preexcitada por WPW, bloquear el nodo AV (digoxina, verapamilo, betabloqueadores) puede favorecer conducción exclusiva por la vía accesoria y degenerar en FV.' },

  // ISQUÉMICA
  { id:'isq-1', topic:'isquemica', diff:2, vignette:'Varón de 58 años con dolor torácico opresivo de 2 horas de evolución y elevación del ST en derivaciones II, III y aVF. Hospital con hemodinamia disponible en 60 minutos. ¿Manejo de reperfusión?', options:['Trombólisis inmediata','Intervención coronaria percutánea primaria','Solo tratamiento médico con antiagregantes','Cirugía de revascularización urgente'], correct:1, exp:'En IAMCEST, la ICP primaria es de elección si puede realizarse dentro de los primeros 90-120 minutos del primer contacto médico.' },
  { id:'isq-2', topic:'isquemica', diff:1, vignette:'Paciente con angina estable de esfuerzo. ¿Cuál es el manejo médico inicial de base?', options:['Ácido acetilsalicílico, estatina, betabloqueador y nitrato sublingual de rescate','Solo reposo absoluto','Anticoagulación oral crónica','Antibiótico profiláctico'], correct:0, exp:'El tratamiento base de la angina estable incluye antiagregación, estatina de alta intensidad, betabloqueador y nitrato sublingual para las crisis.' },
  { id:'isq-3', topic:'isquemica', diff:3, vignette:'Paciente con dolor torácico, troponina elevada y ECG sin elevación del ST pero con datos de alto riesgo (angina recurrente, inestabilidad hemodinámica). ¿Estrategia recomendada?', options:['Manejo conservador ambulatorio','Angiografía coronaria invasiva temprana (<24h)','Trombólisis','Alta con seguimiento en 1 semana'], correct:1, exp:'El síndrome coronario agudo sin elevación del ST de alto riesgo se beneficia de estrategia invasiva temprana con angiografía.' },
  { id:'isq-4', topic:'isquemica', diff:3, vignette:'Cinco días después de un infarto agudo de miocardio, el paciente presenta un soplo holosistólico nuevo en ápex irradiado a axila y edema agudo de pulmón. ¿Complicación mecánica más probable?', options:['Ruptura de músculo papilar con insuficiencia mitral aguda','Pericarditis post-infarto','Aneurisma ventricular','Reinfarto silente'], correct:0, exp:'La ruptura del músculo papilar (frecuente en infarto inferior) produce insuficiencia mitral aguda grave con soplo nuevo y edema pulmonar súbito.' },
  { id:'isq-5', topic:'isquemica', diff:2, vignette:'Paciente con IAM de cara inferior que, al recibir nitroglicerina, presenta hipotensión súbita. ¿Qué se debe sospechar y evitar?', options:['Infarto de ventrículo derecho; evitar nitratos y dar volumen','Taponamiento cardiaco; dar diuréticos','Disección aórtica; iniciar betabloqueador','Embolia pulmonar; dar trombolítico'], correct:0, exp:'El infarto inferior puede extenderse al ventrículo derecho, que depende de precarga; los nitratos reducen la precarga y causan hipotensión grave, por lo que están contraindicados.' },
  { id:'isq-6', topic:'isquemica', diff:2, vignette:'Paciente que 3 semanas después de un infarto presenta fiebre, dolor pleurítico y frote pericárdico. ¿Diagnóstico probable?', options:['Síndrome de Dressler (pericarditis post-infarto tardía)','Reinfarto','Endocarditis infecciosa','Neumonía adquirida en la comunidad'], correct:0, exp:'El síndrome de Dressler es una pericarditis autoinmune tardía (semanas después del IAM), con fiebre, dolor pleurítico y frote pericárdico.' },

  // INSUFICIENCIA CARDIACA
  { id:'ic-1', topic:'ic', diff:2, vignette:'Paciente con disnea súbita, ortopnea, estertores bilaterales y saturación 84%. Se sospecha edema agudo de pulmón cardiogénico. ¿Manejo inicial?', options:['Sentar al paciente, oxígeno, diurético IV y vasodilatador','Decúbito supino y solución salina IV a chorro','Betabloqueador IV en bolo','Alta con furosemida oral'], correct:0, exp:'El edema agudo de pulmón se maneja con posición semisentada, oxígeno, diuréticos de asa IV y vasodilatadores (nitroglicerina) si la presión lo permite.' },
  { id:'ic-2', topic:'ic', diff:2, vignette:'Paciente con insuficiencia cardiaca crónica y FEVI reducida (30%), ya estable. ¿Cuáles son los pilares del tratamiento farmacológico que reducen mortalidad?', options:['Solo diurético de asa','IECA/ARA2 o ARNI, betabloqueador, antagonista de mineralocorticoide e iSGLT2','Digoxina como único fármaco','Antibiótico profiláctico'], correct:1, exp:'La terapia con impacto en mortalidad en IC-FEr combina IECA/ARA2 (o ARNI), betabloqueador, antagonista de mineralocorticoides e inhibidores de SGLT2.' },
  { id:'ic-3', topic:'ic', diff:1, vignette:'¿Qué clasificación se usa para valorar la limitación funcional por síntomas en insuficiencia cardiaca?', options:['Clasificación de Killip','Clasificación NYHA','Escala de Glasgow','Criterios de Jones'], correct:1, exp:'La clasificación NYHA (I-IV) valora la limitación funcional por síntomas de insuficiencia cardiaca según la actividad física.' },
  { id:'ic-4', topic:'ic', diff:2, vignette:'Paciente con edema de miembros inferiores, ingurgitación yugular y hepatomegalia dolorosa, sin disnea significativa. ¿Predomina falla de qué cavidad?', options:['Insuficiencia cardiaca derecha','Insuficiencia cardiaca izquierda aislada','Taponamiento agudo','Estenosis mitral aguda'], correct:0, exp:'Edema periférico, ingurgitación yugular y hepatomegalia son signos clásicos de insuficiencia cardiaca derecha (congestión sistémica).' },
  { id:'ic-5', topic:'ic', diff:1, vignette:'Paciente con disnea de esfuerzo de origen incierto. ¿Qué marcador de laboratorio apoya el diagnóstico de insuficiencia cardiaca?', options:['Péptido natriurético tipo B (BNP) elevado','Procalcitonina elevada','Dímero D elevado','Amilasa elevada'], correct:0, exp:'El BNP/NT-proBNP elevado apoya el diagnóstico de insuficiencia cardiaca en un paciente con disnea de causa incierta.' },

  // VALVULOPATÍAS
  { id:'val-1', topic:'valvular', diff:2, vignette:'Adulto mayor con síncope de esfuerzo, angina y disnea progresiva. Soplo sistólico eyectivo rudo irradiado a carótidas, con pulso parvus et tardus. ¿Diagnóstico?', options:['Estenosis aórtica','Insuficiencia mitral','Estenosis mitral','Comunicación interventricular'], correct:0, exp:'La tríada síncope-angina-disnea con soplo sistólico eyectivo irradiado a carótidas y pulso parvus et tardus es característica de estenosis aórtica severa.' },
  { id:'val-2', topic:'valvular', diff:2, vignette:'Paciente con soplo holosistólico en foco mitral irradiado a la axila, con signos de congestión pulmonar. ¿Diagnóstico más probable?', options:['Insuficiencia mitral','Estenosis pulmonar','Estenosis aórtica','Comunicación interauricular'], correct:0, exp:'El soplo holosistólico en el ápex irradiado a axila es el hallazgo clásico de insuficiencia (regurgitación) mitral.' },
  { id:'val-3', topic:'valvular', diff:3, vignette:'Mujer de 40 años con antecedente de fiebre reumática en la infancia, disnea progresiva, fibrilación auricular y retumbo diastólico en ápex con chasquido de apertura. ¿Diagnóstico?', options:['Estenosis mitral','Insuficiencia aórtica','Prolapso de válvula mitral','Miocardiopatía hipertrófica'], correct:0, exp:'El retumbo diastólico con chasquido de apertura, en contexto de fiebre reumática previa, es característico de estenosis mitral; predispone a fibrilación auricular por dilatación de la aurícula izquierda.' },
  { id:'val-4', topic:'valvular', diff:2, vignette:'Mujer joven asintomática con click mesosistólico seguido de un soplo sistólico tardío en el ápex. ¿Diagnóstico más probable?', options:['Prolapso de la válvula mitral','Estenosis aórtica','Comunicación interventricular','Coartación aórtica'], correct:0, exp:'El click mesosistólico seguido de soplo sistólico tardío es el hallazgo típico del prolapso de la válvula mitral.' },
  { id:'val-5', topic:'valvular', diff:3, vignette:'Paciente con soplo diastólico decreciente en el borde esternal izquierdo, presión de pulso amplia y pulso céler (en martillo de agua). ¿Diagnóstico y una causa posible?', options:['Insuficiencia aórtica; endocarditis infecciosa o disección aórtica','Estenosis pulmonar; cardiopatía congénita','Estenosis tricuspídea; fiebre reumática','Insuficiencia mitral; prolapso valvular'], correct:0, exp:'El soplo diastólico decreciente con pulso céler (Corrigan) y presión de pulso amplia corresponde a insuficiencia aórtica, cuyas causas incluyen endocarditis, disección aórtica y enfermedades del tejido conectivo (Marfan).' },

  // HIPERTENSIÓN ARTERIAL
  { id:'has-1', topic:'has', diff:2, vignette:'Paciente con TA 210/125 mmHg, cefalea intensa, confusión y papiledema (encefalopatía hipertensiva). ¿Cómo se clasifica y cuál es la meta inicial de manejo?', options:['Urgencia hipertensiva; reducir la TA en 24-48 horas por vía oral','Emergencia hipertensiva; reducir la TA media ~25% en la primera hora con fármacos IV','HAS no controlada; ajustar tratamiento ambulatorio','Crisis de pánico; ansiolítico'], correct:1, exp:'La presencia de daño agudo a órgano blanco (encefalopatía) define una emergencia hipertensiva: requiere reducción controlada e IV, aproximadamente 25% de la TA media en la primera hora.' },
  { id:'has-2', topic:'has', diff:1, vignette:'¿Qué diferencia a una urgencia de una emergencia hipertensiva?', options:['El nivel absoluto de la presión arterial únicamente','La presencia o ausencia de daño agudo a órgano blanco','La edad del paciente','El uso previo de antihipertensivos'], correct:1, exp:'La distinción clave no es el número de presión arterial, sino si existe daño agudo a órgano blanco (emergencia) o no (urgencia).' },
  { id:'has-3', topic:'has', diff:2, vignette:'Paciente con hipertensión arterial crónica sin comorbilidades relevantes que inicia tratamiento de primera línea. ¿Qué grupo farmacológico es una opción de primera línea?', options:['IECA/ARA2, calcioantagonista o diurético tiazídico','Nitroprusiato oral','Digoxina','Antiarrítmico clase I'], correct:0, exp:'Los IECA/ARA2, calcioantagonistas y diuréticos tiazídicos son opciones de primera línea para hipertensión arterial no complicada, individualizando según comorbilidades.' },

  { id:'ecop-11', topic:'ecopediatrica', diff:1, vignette:'En ecocardiografía pediátrica, ¿qué representa una puntuación Z de +2 o -2 en una medición cardiovascular?', options:['Un valor que está dos desviaciones estándar por encima o por debajo de la media para el tamaño corporal del paciente','El percentil 2 o 98 de la población general','Una medición que duplica o reduce a la mitad el valor normal','Un error de medición que debe repetirse'], correct:0, exp:'La puntuación Z expresa cuántas desviaciones estándar se aleja una medición del valor medio esperado para el tamaño corporal (habitualmente superficie corporal), siendo ±2 el umbral convencional de normalidad.' },

const CASE_MARKERS = /\b(paciente|hombre|mujer|var[óo]n|ni[ñn][oa]|lactante|reci[ée]n nacido|adolescente|acude|ingresa|consulta|presenta|refiere|de \d+ a[ñn]os|posoperatorio|posparto)\b/i;
function inferKind(q, article){
  if(q.kind) return q.kind;
  if(CASE_MARKERS.test(q.vignette)) return 'caso';
  return (article && article.defaultKind) || 'directa';
}

/* ==================================================================
   QUESTION ENGINE — metadatos cognitivos, validación y enriquecimiento
================================================================== */
const KNOWLEDGE_TYPES = ['recall','understanding','application','discrimination','reasoning','methodology','transfer'];
const KT_LABEL = {
  recall:'Recuerdo', understanding:'Comprensión', application:'Aplicación',
  discrimination:'Discriminación', reasoning:'Razonamiento', methodology:'Metodología',
  transfer:'Transferencia', unknown:'Sin clasificar',
};
const CLINICAL_TYPES = ['direct','clinical_case','progressive_case','comparison','hypothesis_update'];

/* Marcadores para clasificar retroactivamente las preguntas antiguas.
   Es una heurística declarada, no una verdad: las preguntas nuevas deben
   traer knowledgeType explícito y validateQuestion lo exige. */
const KT_MARKERS = [
  { kt:'methodology',    re:/\b(estudio|dise[ñn]o|poblaci[óo]n|muestra|sesgo|limitaci[óo]n|modelo|normativ|proyecto|reclutad|validez|criterios de (inclusi|exclusi)|desenlace|estad[íi]stic|metodol[óo]gic|puntuaci[óo]n z|se construy[óo])\b/i },
  { kt:'discrimination', re:/\b(a diferencia|en lugar de|comparad|en vez de|distingue|diferencia entre|cu[áa]l de las siguientes es una limitaci|discordancia|en contraste)\b/i },
  { kt:'understanding',  re:/\b(por qu[ée]|se debe a|mecanismo|explica|refleja|representa|c[óo]mo se interpreta|qu[ée] significa|debe entenderse)\b/i },
];
function inferKnowledgeType(q){
  if(q.knowledgeType) return q.knowledgeType;
  const t = q.vignette || '';
  for(const m of KT_MARKERS) if(m.re.test(t)) return m.kt;
  if(q.kind === 'caso') return (q.diff >= 3) ? 'reasoning' : 'application';
  return (q.diff <= 1) ? 'recall' : 'understanding';
}
function inferClinicalType(q){
  if(q.clinicalType) return q.clinicalType;
  return q.kind === 'caso' ? 'clinical_case' : 'direct';
}
/* Los conceptos de una pregunta: explícitos > por qIds > por topic. */
function conceptIdsFor(q){
  if(q.conceptIds && q.conceptIds.length) return q.conceptIds;
  const byQ = CONCEPTS.filter(c => c.qIds && c.qIds.includes(q.id)).map(c => c.id);
  if(byQ.length) return byQ;
  const byTopic = CONCEPTS.filter(c => c.articleId === q.article && c.topics && c.topics.includes(q.topic)).map(c => c.id);
  return byTopic;
}
/* Feedback estructurado (#14). Si la pregunta no lo trae (todas las antiguas),
   se degrada con elegancia usando la explicación que ya existía. */
function buildFeedback(q){
  const fb = q.feedback || {};
  return {
    why:      fb.why      || q.exp || '',
    distractors: fb.distractors || {},
    keyFact:  fb.keyFact  || '',
    rule:     fb.rule     || '',
  };
}

/* Validador del contrato de pregunta. Es el sustituto real del "schema de
   salida de la IA": como las preguntas las redacta el asistente en el chat y
   se pegan a mano, este validador es lo que impide que entre una pregunta
   sin concepto, sin referencia o mal formada. Se ejecuta en los self-tests
   y en el panel de debug, no en el camino caliente del render. */
function validateQuestion(q, opts){
  const strict = !!(opts && opts.strict);   // strict = exigido a preguntas nuevas
  const errs = [];
  if(!q.id) errs.push('falta id');
  if(!q.vignette) errs.push('falta enunciado');
  if(!Array.isArray(q.options) || q.options.length !== 4) errs.push('debe tener 4 opciones');
  if(typeof q.correct !== 'number' || q.correct < 0 || q.correct > 3) errs.push('índice correcto inválido');
  if(new Set(q.options || []).size !== (q.options || []).length) errs.push('opciones duplicadas');
  if(!q.exp) errs.push('falta explicación');
  if(!q.article || !articleById(q.article)) errs.push('artículo inexistente');
  if(q.difficulty < 1 || q.difficulty > 5) errs.push('dificultad fuera de 1-5');
  if(!q.conceptIds || !q.conceptIds.length) errs.push('sin concepto vinculado');
  q.conceptIds && q.conceptIds.forEach(cid => { if(!conceptById(cid)) errs.push('concepto inexistente: '+cid); });
  if(q.evidenceScope !== 'article' && q.evidenceScope !== 'principle') errs.push('evidenceScope inválido');
  // Control de alucinación: si dice basarse en el artículo, debe poder señalar de dónde.
  if(q.evidenceScope === 'article' && !q.sourceRef) errs.push('pregunta factual sin sourceRef');
  if(strict){
    if(!q.knowledgeType || !KNOWLEDGE_TYPES.includes(q.knowledgeType)) errs.push('knowledgeType ausente o inválido');
    if(!q.feedback || !q.feedback.why) errs.push('falta feedback.why');
    if(!q.feedback || !q.feedback.keyFact) errs.push('falta feedback.keyFact');
  }
  return { ok: errs.length === 0, errors: errs };
}

/* Enriquecimiento en memoria. Idempotente: no reescribe el archivo ni el
   almacenamiento, solo construye la vista enriquecida de cada pregunta. */
function enrichQuestion(q, article){
  const kind = inferKind(q, article);
  const base = { ...q, article: article.id, diff: q.diff || 2, kind };
  const conceptIds = conceptIdsFor(base);
  return {
    ...base,
    conceptIds,
    knowledgeType: inferKnowledgeType(base),
    clinicalType:  inferClinicalType(base),
    // diff 1-3 heredado -> escala 1-5 del nuevo modelo
    difficulty:    q.difficulty || Math.min(5, Math.max(1, Math.round((base.diff - 1) * 2 + 1))),
    evidenceScope: q.evidenceScope || 'article',
    sourceRef:     q.sourceRef || (article.ref || ''),
    feedback:      buildFeedback(base),
    // Marca si los metadatos vienen de heurística en vez de autoría explícita.
    inferred: !(q.knowledgeType && q.conceptIds && q.feedback),
  };
}

const QUESTIONS = ARTICLES.flatMap(a => a.data.map(q => enrichQuestion(q, a)));
const questionsOfConcept = (cid) => QUESTIONS.filter(q => q.conceptIds.includes(cid));

/* ------------------------------------------------------------------
   SPRITES 8-BIT (arte generado por celdas, sin imágenes externas)
------------------------------------------------------------------- */
function shade(hex, amt){
  let c = hex.replace('#','');
  if(c.length===3) c = c.split('').map(x=>x+x).join('');
  let r = parseInt(c.substring(0,2),16), g = parseInt(c.substring(2,4),16), b = parseInt(c.substring(4,6),16);
  r = Math.max(0,Math.min(255,r+amt)); g = Math.max(0,Math.min(255,g+amt)); b = Math.max(0,Math.min(255,b+amt));
  const h = n => n.toString(16).padStart(2,'0');
  return '#'+h(r)+h(g)+h(b);
}

function spriteHtml(grid, palette, unit, cls){
  let cells = '';
  for(let ry=0; ry<grid.length; ry++){
    const row = grid[ry];
    for(let rx=0; rx<row.length; rx++){
      const ch = row[rx];
      if(ch === '.') continue;
      const color = palette[ch];
      if(!color) continue;
      cells += `<i style="position:absolute;left:${rx*unit}px;top:${ry*unit}px;width:${unit}px;height:${unit}px;background:${color};"></i>`;
    }
  }
  const w = grid[0].length*unit, h = grid.length*unit;
  return `<div class="pixel-sprite ${cls||''}" style="width:${w}px;height:${h}px;">${cells}</div>`;
}

const hasSprite = (key) => !!(key && SPRITE_IMAGES[key]);
function imgSpriteHtml(key, unit, cls){
  const size = unit * 10;
  return `<div class="pixel-sprite img ${cls||''}" style="width:${size}px;height:${size}px;">
    <img src="${SPRITE_IMAGES[key]}" alt="" draggable="false">
  </div>`;
}

function playerPalette(color){ return { O:'#20140c', K:'#f2c396', E:'#ffffff', B:color, D:shade(color,-55) }; }
function playerSpriteHtml(archetype, unit, frame, cls){
  if(hasSprite(archetype.id)) return imgSpriteHtml(archetype.id, unit, cls);
  return spriteHtml(PLAYER_FRAMES[frame||0], playerPalette(archetype.color), unit, cls);
}

const CROWN_ROW = '.C.C..C.C.';
function enemyPalette(color){ return { O:'#181008', B:color, D:shade(color,-50), E:'#ffffff', W:shade(color,-25), C:'#f4c542' }; }
function enemySpriteHtml(levelDef, unit, cls){
  if(hasSprite(levelDef.key)) return imgSpriteHtml(levelDef.key, unit, cls);
  let grid = ENEMY_GRIDS[levelDef.spriteType] || ENEMY_GRIDS.biped;
  if(levelDef.crowned) grid = [CROWN_ROW].concat(grid);
  return spriteHtml(grid, enemyPalette(levelDef.color), unit, cls);
}

/* Cuántas preguntas puede llegar a consumir UN nivel en el peor caso:
   el combate termina cuando alguien llega a 0, así que el máximo es
   (errores que aguanta el jugador) + (aciertos necesarios) - 1. */
const missesToDie = (maxHp) => Math.ceil(maxHp / MISS_DAMAGE);
const maxQuestionsForLevel = (maxHp) => missesToDie(maxHp) + HITS_TO_WIN - 1;

/* ------------------------------------------------------------------
   MEZCLA 80/20
   Cada nivel se arma con 80% de preguntas del artículo en estudio y
   20% de preguntas de OTROS artículos que ya estén en el cuaderno de
   repaso (es decir, que el jugador ya haya visto alguna vez). Si aún
   no hay historial de otros artículos, el nivel se llena 100% con el
   artículo actual.
------------------------------------------------------------------- */
const CURRENT_SHARE = 0.8;

/* ------------------------------------------------------------------
   ALGORITMO DE PRESUPUESTO DE PREGUNTAS
   Determina cuántas preguntas hay que redactar para un artículo nuevo
   para poder jugar los 10 niveles SIN repetir ninguna pregunta, incluso
   en el peor caso (la clase con más HP fallando casi todo).
   Se usa en la pantalla de inicio para saber si un artículo alcanza.
------------------------------------------------------------------- */
function questionBudget(maxHp){
  const hp = maxHp || MAX_ARCHETYPE_HP;
  const perLevel   = maxQuestionsForLevel(hp);           // peor caso por nivel
  const campaign   = perLevel * NUM_LEVELS;              // peor caso total
  const fromCurrent= Math.ceil(campaign * CURRENT_SHARE);// cuota del artículo activo
  const fromOthers = campaign - fromCurrent;             // cuota de repaso mezclado
  const typical    = Math.ceil((HITS_TO_WIN + 2) * NUM_LEVELS * CURRENT_SHARE);
  return { perLevelMax:perLevel, campaignMax:campaign, needCurrent:fromCurrent, needOthers:fromOthers, comfortable:typical, minimum:HITS_TO_WIN*NUM_LEVELS };
}

/* Reparto de dificultad por nivel: pesos [fácil, media, difícil].
   La curva sube de nivel 1 (casi todo fácil) a nivel 10 (casi todo difícil). */
const DIFF_WEIGHTS = {
  1:[7,3,0], 2:[6,4,0], 3:[4,5,1], 4:[3,5,2], 5:[2,5,3],
  6:[2,4,4], 7:[1,4,5], 8:[1,3,6], 9:[0,3,7], 10:[0,2,8],
};
/* Convierte los pesos del nivel en una lista concreta de n dificultades. */
function diffPlan(levelNum, n){
  const w = DIFF_WEIGHTS[levelNum] || [3,4,3];
  const total = w[0]+w[1]+w[2];
  const plan = [];
  const exact = w.map(x => (x/total)*n);
  const base = exact.map(Math.floor);
  let assigned = base.reduce((a,b)=>a+b,0);
  const rema = exact.map((x,i) => ({ i, r: x-base[i] })).sort((a,b) => b.r-a.r);
  let k = 0;
  while(assigned < n){ base[rema[k % 3].i]++; assigned++; k++; }
  base.forEach((count,i) => { for(let j=0;j<count;j++) plan.push(i+1); });
  return plan;
}

/* ==================================================================
   LEARNING ENGINE
   ------------------------------------------------------------------
   Mide dominio por CONCEPTO, no por pregunta. No toca el DOM ni decide
   cómo se ve nada: solo recibe intentos y responde con números.

   Fórmula de mastery (heurística interpretable, documentada):

     mastery = accuracy' * difficultyWeight * retention * transferBonus * calibrationAdj

     accuracy'        acierto con suavizado de Laplace (prior 0.5) y
                       ponderado por recencia (exp. decay): los intentos
                       recientes pesan más que los viejos, para que 10
                       aciertos antiguos no tapen 3 fallos nuevos.
     difficultyWeight  0.85–1.15 según qué tan difíciles eran las preguntas
                       acertadas: acertar difícil vale más que acertar fácil.
     retention         exp(-díasDesdeÚltimoIntento / stability), acotado a
                       [0.3, 1]. El dominio decae si no se repasa: por eso
                       mide RETENCIÓN y no solo historial acumulado.
     transferBonus     1.10 si hubo transferencia acertada, 0.92 si se
                       intentó y falló, 1 si no se ha probado.
     calibrationAdj    penaliza errores con alta confianza (misconceptions):
                       0.85 si hay al menos uno, 1 si no.

   Resultado normalizado en [0,1]. Ver PULSO.selfTest() para los casos
   verificados.
================================================================== */
const LearningEngine = (function(){
  const CONF_LEVELS = [0.25, 0.5, 0.75, 1.0];
  const RECENCY_HALFLIFE_DAYS = 10; // a los 10 días, un intento pesa la mitad

  function emptyConceptStats(){
    return {
      attempts:0, correct:0, incorrect:0, highConfErrors:0,
      sumConfidence:0, calibrationHits:0, calibrationTotal:0,
      transferTried:0, transferOk:0,
      diffSumCorrect:0, diffCountCorrect:0,
      lastAt:null, nextAt:0, stability:2, mastery:0, weakness:false, misconception:false,
      ladder:-1, // -1 = nunca programado; ver SchedulerEngine.nextInterval
      scheduledAtAttempt:-1, // guarda de idempotencia de SchedulerEngine.schedule()
      history:[], // últimos intentos: {at, correct, confidence, difficulty, knowledgeType}
    };
  }

  function ensureConcept(cid){
    if(!DATA.learning.concepts[cid]) DATA.learning.concepts[cid] = emptyConceptStats();
    return DATA.learning.concepts[cid];
  }

  /* Registra un intento. `ctx` describe de dónde vino (batalla, pretest,
     estudio, recall libre) para que el debrief y el debug puedan filtrar. */
  function recordAttempt({ qid, conceptIds, correct, confidence, ms, difficulty, knowledgeType, context }){
    const at = Date.now();
    conceptIds = conceptIds && conceptIds.length ? conceptIds : ['sin-concepto'];
    DATA.learning.attempts.push({ at, qid, conceptIds, correct, confidence, ms, difficulty, knowledgeType, context: context||'battle' });
    // Solo se guardan los últimos 500 intentos crudos; los conceptos agregan el resto.
    if(DATA.learning.attempts.length > 500) DATA.learning.attempts.splice(0, DATA.learning.attempts.length-500);

    conceptIds.forEach(cid => {
      const c = ensureConcept(cid);
      c.attempts++;
      if(correct) c.correct++; else c.incorrect++;
      if(typeof confidence === 'number'){
        c.sumConfidence += confidence;
        c.calibrationTotal++;
        // bien calibrado: confianza alta+acierto o confianza baja+error
        const wellCalibrated = (correct && confidence >= 0.5) || (!correct && confidence < 0.5);
        if(wellCalibrated) c.calibrationHits++;
        if(!correct && confidence >= 0.75) c.highConfErrors++;
      }
      if(correct){ c.diffSumCorrect += (difficulty||3); c.diffCountCorrect++; }
      if(knowledgeType === 'transfer'){ c.transferTried++; if(correct) c.transferOk++; }
      c.history.push({ at, correct, confidence, difficulty, knowledgeType });
      if(c.history.length > 30) c.history.shift();
      c.lastAt = at;
      recomputeConcept(cid);
    });
    saveData();
    return DATA.learning.concepts;
  }

  function recomputeConcept(cid){
    const c = DATA.learning.concepts[cid];
    if(!c || !c.attempts) return;

    // accuracy' con Laplace + peso por recencia
    const now = Date.now();
    let wSum = 0, wCorrect = 0;
    c.history.forEach(h => {
      const days = (now - h.at) / 86400000;
      const w = Math.pow(0.5, days / RECENCY_HALFLIFE_DAYS);
      wSum += w; if(h.correct) wCorrect += w;
    });
    const accuracy = wSum > 0 ? (wCorrect + 0.5) / (wSum + 1) : 0.5;

    // difficultyWeight: 0.85 (todo fácil) .. 1.15 (todo difícil)
    const avgDiffCorrect = c.diffCountCorrect ? c.diffSumCorrect / c.diffCountCorrect : 3;
    const difficultyWeight = 0.85 + (Math.min(5, Math.max(1, avgDiffCorrect)) - 1) / 4 * 0.30;

    // retention: decae con los días desde el último intento
    const daysSince = c.lastAt ? (now - c.lastAt) / 86400000 : 0;
    const retention = Math.max(0.3, Math.min(1, Math.exp(-daysSince / Math.max(1, c.stability))));

    // transferBonus
    let transferBonus = 1;
    if(c.transferTried > 0) transferBonus = c.transferOk > 0 ? 1.10 : 0.92;

    // calibrationAdj: penaliza misconceptions (error con alta confianza)
    const calibrationAdj = c.highConfErrors > 0 ? 0.85 : 1;

    let mastery = accuracy * difficultyWeight * retention * transferBonus * calibrationAdj;
    mastery = Math.max(0, Math.min(1, mastery));
    c.mastery = mastery;

    // debilidad: dominio bajo con evidencia suficiente
    c.weakness = c.attempts >= 3 && mastery < 0.5 && (c.incorrect >= 2 || c.highConfErrors >= 1);
    // misconception: al menos un fallo con confianza alta (falsa seguridad)
    c.misconception = c.highConfErrors >= 1;

    // estabilidad (usada por el Scheduler): crece con aciertos, cae con fallos
    const lastCorrect = c.history.length ? c.history[c.history.length-1].correct : null;
    if(lastCorrect === true) c.stability = Math.min(60, c.stability * 1.6);
    else if(lastCorrect === false) c.stability = Math.max(1, c.stability * 0.5);
  }

  function masteryOf(cid){
    const c = DATA.learning.concepts[cid];
    return c ? c.mastery : 0;
  }
  function calibrationOf(cid){
    const c = DATA.learning.concepts[cid];
    if(!c || !c.calibrationTotal) return null;
    return c.calibrationHits / c.calibrationTotal;
  }
  function weaknesses(articleId){
    return CONCEPTS
      .filter(c => !articleId || c.articleId === articleId)
      .map(c => ({ concept:c, stats: DATA.learning.concepts[c.id] }))
      .filter(x => x.stats && x.stats.weakness)
      .sort((a,b) => a.stats.mastery - b.stats.mastery);
  }
  function misconceptions(articleId){
    return CONCEPTS
      .filter(c => !articleId || c.articleId === articleId)
      .map(c => ({ concept:c, stats: DATA.learning.concepts[c.id] }))
      .filter(x => x.stats && x.stats.misconception);
  }
  function statsOf(cid){ return DATA.learning.concepts[cid] || null; }

  return { CONF_LEVELS, recordAttempt, masteryOf, calibrationOf, weaknesses, misconceptions, statsOf, ensureConcept };
})();

/* ==================================================================
   SCHEDULER ENGINE — repetición espaciada POR CONCEPTO
   ------------------------------------------------------------------
   Independiente de DATA.deck (que sigue siendo SM-2 por tarjeta para la
   pantalla "Estudiar ahora"). Este scheduler decide cuándo un CONCEPTO
   vuelve a estar "listo" para la selección de preguntas en batalla o en
   una sesión de repaso con interleaving.

   Diseño intencionalmente simple y reemplazable: toda la lógica vive en
   `nextInterval()`. El día que se quiera cambiar a un algoritmo tipo
   SM-2/FSRS completo, solo hay que sustituir esa función — el resto del
   juego solo llama a `schedule()` y `dueConcepts()`.
================================================================== */
const SchedulerEngine = (function(){
  const LADDER_DAYS = [1, 3, 7, 14, 30, 60];

  function nextInterval(stats){
    const last = stats.history[stats.history.length-1];
    if(stats.ladder === undefined) stats.ladder = -1; // datos migrados de antes de este campo
    if(!last){ stats.ladder = 0; return LADDER_DAYS[0]; }
    if(!last.correct){
      // falló: vuelve al primer peldaño (nunca por debajo)
      stats.ladder = 0;
      return LADDER_DAYS[0];
    }
    if(last.confidence != null && last.confidence < 0.5){
      // acertó pero con baja confianza: no sube de peldaño, intervalo moderado.
      // Si nunca se había programado, al menos arranca en el primer peldaño.
      stats.ladder = Math.max(stats.ladder, 0);
      return LADDER_DAYS[Math.min(stats.ladder, LADDER_DAYS.length-1)];
    }
    // acertó con confianza alta (o sin dato) y va bien: sube un peldaño desde
    // donde estaba (arranca en el primero la primera vez que se programa).
    stats.ladder = Math.min(LADDER_DAYS.length-1, stats.ladder + 1);
    return LADDER_DAYS[stats.ladder];
  }

  /* schedule() debe ser idempotente si no hubo un intento nuevo desde la
     última vez que se llamó: si no, cada re-render, cada recarga de página
     o cada re-ejecución de la migración volvería a avanzar el peldaño y
     alejaría el repaso sin que el jugador hubiera hecho nada. Se ata el
     cálculo al contador de intentos (entero, sin ambigüedad de timestamps)
     en vez de repetirlo en cada llamada. */
  function schedule(cid){
    const stats = LearningEngine.statsOf(cid);
    if(!stats || !stats.attempts) return;
    if(stats.scheduledAtAttempt === stats.attempts) return stats.nextAt;
    const days = nextInterval(stats);
    stats.nextAt = Date.now() + days*86400000;
    stats.scheduledAtAttempt = stats.attempts;
    saveData();
    return stats.nextAt;
  }
  function dueConcepts(articleId){
    const now = Date.now();
    return CONCEPTS
      .filter(c => !articleId || c.articleId === articleId)
      .filter(c => { const s = DATA.learning.concepts[c.id]; return s && s.nextAt && s.nextAt <= now; })
      .map(c => c.id);
  }
  function nextReviewAt(cid){
    const s = DATA.learning.concepts[cid];
    return s ? s.nextAt : 0;
  }
  return { schedule, dueConcepts, nextReviewAt, LADDER_DAYS };
})();

const activeQuestions = () => QUESTIONS.filter(q => q.article === CURRENT_ARTICLE);
const articleRef  = (q) => { const a = articleById(q.article); return a ? a.ref : ''; };

function freshCampaign(){
  return { levelsCleared: Array(10).fill(false), playerHp: null, usedQuestionIds: [], failedQuestionIds: [], completed:false, articleTag: CURRENT_ARTICLE };
}
function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { avatar:null, campaign: freshCampaign(), deck:{} };
}
function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }

let DATA = loadData();

/* Migración aditiva del estado de aprendizaje: no toca nada existente,
   solo crea DATA.learning si falta. Idempotente y segura de re-ejecutar. */
function migrateLearningState(){
  if(!DATA.learning) DATA.learning = { v:1, attempts:[], concepts:{} };
  if(!DATA.learning.concepts) DATA.learning.concepts = {};
  if(!DATA.learning.attempts) DATA.learning.attempts = [];
  // Siembra retroactiva: si ya había failedQuestionIds de partidas viejas,
  // que el Codex no arranque completamente en blanco para esos conceptos.
  const seeded = DATA.learning._seededFromLegacy;
  if(!seeded && DATA.campaign && DATA.campaign.failedQuestionIds && DATA.campaign.failedQuestionIds.length){
    DATA.campaign.failedQuestionIds.forEach(qid => {
      const q = byIdSafe(qid);
      if(!q) return;
      (q.conceptIds||[]).forEach(cid => {
        const c = LearningEngine.ensureConcept(cid);
        // Solo sembramos si el concepto no tiene ya datos reales (evita duplicar).
        if(c.attempts === 0){
          c.attempts = 1; c.incorrect = 1;
          c.history.push({ at: Date.now(), correct:false, confidence:null, difficulty:3, knowledgeType:null });
          c.lastAt = Date.now();
        }
      });
    });
    DATA.learning._seededFromLegacy = true;
  }
  Object.keys(DATA.learning.concepts).forEach(cid => { if(conceptById(cid)) SchedulerEngine.schedule(cid); });
  saveData();
}
// byId (el índice real) se define más abajo; esta versión mínima solo se usa
// durante la migración, que corre antes de que byId exista.
function byIdSafe(qid){ return QUESTIONS.find(q => q.id === qid); }
migrateLearningState();

if(!DATA.campaign.articleTag || DATA.campaign.articleTag !== CURRENT_ARTICLE){

  // pero el mazo de tarjetas de repaso (DATA.deck) NUNCA se borra.
  DATA.campaign = freshCampaign();
  saveData();
}
